<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
<title>Магазин</title>
<style>
/* 
=========================================================
 CSS-ПЕРЕМЕННЫЕ И БАЗОВЫЕ НАСТРОЙКИ ТЕМЫ
=========================================================
Поддержка светлой и темной темы (prefers-color-scheme).
Цвета вынесены в переменные для быстрой смены брендинга.
*/
:root{--bg:#f4f5f2;--cd:#fff;--tx:#1c2321;--mu:#68716d;--br:#dfe3de;--pr:#0f766e;--pt:#fff;--ok:#15803d;--er:#b42318;--wa:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#121615;--cd:#1c2220;--tx:#eef2ef;--mu:#9aa5a0;--br:#2c3532;--pr:#2dd4bf;--pt:#06201c;--ok:#4ade80;--er:#f87171;--wa:#fbbf24}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; touch-action: manipulation;}

/* Основной контейнер приложения с отступом под нижнюю навигацию */
#app{max-width:640px;margin:0 auto;padding:14px 14px 96px}

/* Типографика и базовые элементы */
h1{font-size:24px;margin:6px 0 12px}h2{font-size:17px;margin:20px 0 8px}
small{color:var(--mu);font-size:13px}.mu{color:var(--mu);padding:10px 0}
button,input{font:inherit;color:inherit}
button{min-height:48px;padding:0 16px;border:1px solid var(--br);background:var(--cd);border-radius:12px;cursor:pointer}
button.pb{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:600}
button.big{width:100%;min-height:56px;font-size:18px;margin-top:12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
input{width:100%;min-height:48px;padding:0 12px;border:1px solid var(--br);border-radius:12px;background:var(--cd)}
label{display:block;margin:10px 0;font-size:14px;color:var(--mu)}label input{margin-top:4px;color:var(--tx)}

/* 
=========================================================
 КАРТОЧКИ, СПИСКИ И ФОРМЫ (UI КОМПОНЕНТЫ)
=========================================================
*/
/* Карточка товара/документа (белая плашка) */
.c{background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:12px;margin:10px 0}
/* Сетка для дашборда (2 колонки) */
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g .c{margin:0}.g b{display:block;font-size:22px}.g .w{grid-column:1/3}
/* Flex-строка с отступами */
.row,.r{display:flex;gap:8px;align-items:center}.row{margin:12px 0}.row button{flex:1}.f{flex:1;min-width:0}
/* Усечение длинного текста троеточием */
.f b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Миниатюры фотографий в списках товаров */
.th, .ph { width: 44px; height: 44px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
.ph { background: var(--br); display: flex; align-items: center; justify-content: center; font-size: 22px; }

/* Панель поиска и сканирования (залипает сверху при скролле) */
.sb{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:3}.sb input{flex:1}
/* Элементы корзины (количество, цена) */
.q{min-width:32px;text-align:center;font-size:20px}.pi{width:96px;text-align:right}.lt{flex:1;text-align:right;font-weight:600}
/* Кнопка крестик/иконка */
.x{min-height:40px;width:40px;padding:0}
/* Итоговая сумма внизу */
.tot{display:flex;justify-content:space-between;font-size:22px;padding:14px 4px 0}

/* Цвета статусов */
.lo{color:var(--er)}.ok{color:var(--ok)}.wa{color:var(--wa)}

/* 
=========================================================
 НАВИГАЦИЯ, МОДАЛЬНЫЕ ОКНА И УВЕДОМЛЕНИЯ
=========================================================
*/
/* Нижнее меню (TabBar) */
nav{position:fixed;left:0;right:0;bottom:0;display:none;background:var(--cd);border-top:1px solid var(--br);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:0 2px;color:var(--mu)}
nav button span{font-size:20px}nav button.on{color:var(--pr);font-weight:700}

/* Затемнение (оверлей) и контейнер модального окна (BottomSheet) */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.ov[hidden]{display:none}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}

/* Всплывающие уведомления (Toast) сверху */
#toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;padding:12px 14px;border-radius:12px;display:none;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}

/* Статистика и документы */
.bar{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px}
.gr{background:var(--ok);color:var(--pt);border-color:var(--ok)}.rd{background:var(--er);color:var(--pt);border-color:var(--er)}

/* 1. Контейнер камеры: на весь экран (под модальными окнами и уведомлениями) */
#cam { position: fixed; inset: 0; background: #000; z-index: 8; display: block; }
#cam[hidden] { display: none !important; }

/* 2. Видео создаётся заново при каждом открытии (иначе iOS иногда «залипает» на уменьшенном размере) */
#cvbox { position: absolute; inset: 0; z-index: 1; }
#cvbox video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* 3. Рамка прицеливания (220x120) */
.cam-frame {
  position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
  width: 220px; height: 120px; z-index: 2; pointer-events: none;
  background: 
    linear-gradient(#fbbf24, #fbbf24) top left / 20px 3px no-repeat,
    linear-gradient(#fbbf24, #fbbf24) top left / 3px 20px no-repeat,
    linear-gradient(#fbbf24, #fbbf24) top right / 20px 3px no-repeat,
    linear-gradient(#fbbf24, #fbbf24) top right / 3px 20px no-repeat,
    linear-gradient(#fbbf24, #fbbf24) bottom left / 20px 3px no-repeat,
    linear-gradient(#fbbf24, #fbbf24) bottom left / 3px 20px no-repeat,
    linear-gradient(#fbbf24, #fbbf24) bottom right / 20px 3px no-repeat,
    linear-gradient(#fbbf24, #fbbf24) bottom right / 3px 20px no-repeat;
}
.cam-laser { position: absolute; width: 100%; height: 2px; background: #fbbf24; box-shadow: 0 0 10px #fbbf24; animation: scan 2s infinite ease-in-out; }
@keyframes scan { 0%, 100% { top: 5%; } 50% { top: 95%; } }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 36px; height: 36px; border: 3px solid var(--br); border-top-color: var(--pr); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }

/* 4. Нижняя плашка */
.cam-bottom { position: absolute; bottom: 0; left: 0; right: 0; background: var(--cd); border-radius: 20px 20px 0 0; padding: 24px 16px calc(16px + env(safe-area-inset-bottom, 0px)); text-align: center; z-index: 2; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); }
.cam-bottom h3 { margin: 0 0 8px; font-size: 20px; }
.cam-bottom p { color: var(--mu); margin: 0 0 24px; font-size: 15px; line-height: 1.4; }

/* Кнопка отмены */
.cam-cancel { background: none; border: none; color: var(--mu); font-size: 15px; padding: 12px; margin-top: 12px; min-height: 40px; display: inline-block; cursor: pointer; }

/* Скрываем элементы с классом owner-only, если включен режим кассира */
.cashier-mode .owner-only { display: none !important; }

/* Окно создания документа (продажа / закупка / сверка): закрывает список и нижнее меню */
#win{position:fixed;inset:0;z-index:6;background:var(--bg);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px))}
#win[hidden]{display:none}
#win .wi{max-width:640px;margin:0 auto}
.wh{display:flex;align-items:center;gap:12px;margin-bottom:6px}.wh b{font-size:20px}
.sm{min-height:40px;font-size:14px;padding:0 10px;flex:none}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:14px;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.cc b{font-size:17px;overflow-wrap:anywhere}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.chips button{flex:none;min-height:40px;padding:0 14px}
.chips button.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.cbar{position:sticky;bottom:0;padding:10px 0 2px;background:linear-gradient(to bottom,transparent,var(--bg) 35%)}.cbar .big{margin-top:0}
.bd{background:var(--pr);color:var(--pt);border-radius:999px;min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;padding:0 8px;flex:none}
</style>
<!-- Подключение SDK Telegram Web App -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Подключение Supabase JS клиента -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<!-- Распознавание штрихкодов: ZXing-C++ (WebAssembly) с интерфейсом BarcodeDetector -->
<script defer src="https://cdn.jsdelivr.net/npm/barcode-detector@3.0.1/dist/iife/ponyfill.min.js"></script>
</head>
<body>

<!-- Главный контейнер для рендера страниц -->
<div id="app"><div style="text-align:center;padding:80px 16px"><div class="spinner"></div><h2 style="margin:0 0 8px">Подключение к серверу…</h2><p class="mu" style="margin:0">Пожалуйста, подождите…</p></div></div>

<!-- Нижнее меню навигации -->
<div id="win" hidden></div>

<nav id="nav">
  <button data-t="home" onclick="go('home')"><span>🏠</span>Главная</button>
  <button data-t="prod" onclick="go('prod')"><span>📦</span>Товары</button>
  <button class="owner-only" data-t="buy" onclick="go('buy')"><span>📥</span>Закупка</button>
  <button data-t="sale" onclick="go('sale')"><span>🛒</span>Продажа</button>
  <button class="owner-only" data-t="inv" onclick="go('inv')"><span>📋</span>Сверка</button>
  <button class="owner-only" data-t="rep" onclick="go('rep')"><span>📊</span>Отчёты</button>
</nav>

<!-- Окно камеры сканера штрихкодов -->
<div id="cam" hidden>
  <!-- Сюда при каждом открытии добавляется новый <video>. Тап по видео тоже закрывает сканер -->
  <div id="cvbox" onclick="closeCam()"></div>

  <div class="cam-frame">
    <div class="cam-laser"></div>
  </div>

  <div class="cam-bottom">
    <h3>Отсканируйте код</h3>
    <p>Наведите рамку на штрихкод<br><span style="font-size:13px; opacity:0.8;">Отдалите телефон на 15–20 см для фокуса</span></p>

    <svg width="120" height="60" viewBox="0 0 120 60" fill="currentColor" style="color: var(--tx); margin: 0 auto; display: block; overflow: visible;">
      <rect x="0" y="0" width="6" height="60" />
      <rect x="10" y="0" width="4" height="60" />
      <rect x="20" y="0" width="10" height="60" />
      <rect x="34" y="0" width="4" height="60" />
      <rect x="42" y="0" width="14" height="60" />
      <rect x="60" y="0" width="6" height="60" />
      <rect x="70" y="0" width="8" height="60" />
      <rect x="84" y="0" width="4" height="60" />
      <rect x="94" y="0" width="8" height="60" />
      <rect x="108" y="0" width="4" height="60" />
      <rect x="116" y="0" width="4" height="60" />
      <path d="M -5 10 L -5 -5 L 10 -5" fill="none" stroke="#fbbf24" stroke-width="3" />
      <path d="M 125 10 L 125 -5 L 110 -5" fill="none" stroke="#fbbf24" stroke-width="3" />
      <path d="M -5 50 L -5 65 L 10 65" fill="none" stroke="#fbbf24" stroke-width="3" />
      <path d="M 125 50 L 125 65 L 110 65" fill="none" stroke="#fbbf24" stroke-width="3" />
    </svg>

    <button class="cam-cancel" onclick="closeCam()">Отмена</button>
  </div>
</div>

<!-- Контейнер для всплывающих окон (BottomSheet) -->
<div class="ov" id="md" hidden><div class="sh" id="mb"></div></div>

<!-- Контейнер для системных уведомлений -->
<div id="toast" role="status"></div>

<script>
/* 
=========================================================
 1. ИНИЦИАЛИЗАЦИЯ И ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
=========================================================
*/
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const SUPABASE_URL = 'https://zejpqdzashqaudcxdpoh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5FcwXPo1yU6BzYhmmfVQcA_DNv9U7ku';
let sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const sb0 = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); // клиент без токена — только для входа (auth-store)

// Глобальное состояние приложения
let BRANCH = null, BRANCHES = [], IS_ADMIN = false,   // текущий филиал, доступные филиалы, администратор платформы
    STORE = null,       // ID магазина
    USER = null,        // ID пользователя (Telegram)
    ROLE = null,        // Роль (owner/cashier)
    STORE_NAME = 'Сегодня',
    P = [],             // Локальный кэш каталога товаров (P - Products)
    busy = false,       // Блокировка интерфейса во время сетевых запросов
    ASK = null,         // Callback для модального окна подтверждения
    T = null,           // Временные данные для модальных окон
    tmr;                // Таймер скрытия toast-уведомлений
const LOW = 2;          // Порог предупреждения о низком остатке товара
const APP_VERSION = '1.10.0'; // Меняйте при каждой загрузке файла: видно внизу главной, помогает понять, не показывается ли старая версия из кэша

// Глобальный перехват ошибок. Стоит ДО остального кода, чтобы любая ошибка
// при запуске показывалась на экране, а не молча останавливала приложение.
addEventListener('error', e => toast(e.message, 'er'));
addEventListener('unhandledrejection', e => toast(e.reason?.message || String(e.reason), 'er'));

/* 
=========================================================
 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ (Утилиты)
=========================================================
Функции объявлены через function (а не const), чтобы они были доступны
в любом месте файла, в том числе при создании состояния ниже.
*/
function $(s) { return document.querySelector(s); }
function r2(n) { return Math.round(n * 100) / 100; } // Округление до 2 знаков
function fmt(n) { return r2(+n || 0).toLocaleString('ru-RU') + ' сом'; } // Формат валюты
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); } // Экранирование XSS
function dk(t) { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); } // Формат даты YYYY-MM-DD
function today() { return dk(Date.now()); }
function G(id) { return P.find(p => p.id === id); } // Получить товар из кэша по ID
function nm(p) { return p ? (p.name || p.barcode || 'Без названия') : '(удалён)'; } // Имя товара с fallback
function num(v) { v = String(v ?? '').trim().replace(',', '.'); if (v === '') return 0; return +v >= 0 ? r2(+v) : false; } // Парсинг чисел из инпутов

// Состояние текущей сессии (переключение вкладок, корзины)
const S = { 
  docs: {},             // Кэш загруженных документов (чеки, закупки)
  tab: 'home',          // Текущая активная вкладка
  cart: [],             // Корзина продажи (sale)
  pcart: [],            // Корзина закупки (buy)
  inv: {},              // Список товаров в сверке (inv)
  rb: null,             // Филиал в отчётах: id или 'all'
  cartView: false,      // В окне продажи: показан чек (true) или каталог (false)
  sq: '', cat: null, sub: null, lim: 30,   // Поиск, выбранная категория/подкатегория, сколько товаров показано
  from: today(),        // Начальная дата для отчетов
  to: today()           // Конечная дата для отчетов 
};

/* Вывод уведомлений на экран */
function toast(m, k) {
  const t = $('#toast'); t.textContent = m; t.style.display = 'block';
  t.style.background = k === 'er' ? 'var(--er)' : k === 'ok' ? 'var(--ok)' : 'var(--tx)';
  t.style.color = k ? 'var(--pt)' : 'var(--bg)';
  clearTimeout(tmr); tmr = setTimeout(() => t.style.display = 'none', k === 'er' ? 3500 : 1500);
}

/* Обертка для асинхронных вызовов к БД (блокирует повторные клики) */
async function run(fn) {
  if (busy) return; busy = true;
  try { await fn(); }
  catch (e) {
    if (/jwt|token|expired/i.test(e.message || '')) { try { await relogin(); toast('Сессия обновлена — повторите действие'); } catch (e2) { toast('Сессия истекла — откройте приложение заново', 'er'); } }
    else toast(e.message || String(e), 'er');
  } 
  finally { busy = false; render(); }
}

/* Управление модальными окнами */
function modal(h) { $('#mb').innerHTML = h; $('#md').hidden = false; }
function closeModal() { $('#md').hidden = true; }
function ask(t, y) { ASK = y; modal(`<h2>${esc(t)}</h2><div class="row"><button onclick="closeModal()">Нет</button><button class="pb" onclick="closeModal();ASK()">Да</button></div>`); }

/* 
=========================================================
 3. РАБОТА С БАЗОЙ ДАННЫХ (Supabase)
=========================================================
*/

/* Загрузка полного каталога товаров магазина в локальный кэш (пагинация по 1000) */
async function load() {
  const pProducts = (async () => {
    let all = [], f = 0;
    for (;;) {
      const { data, error } = await sb.from('products').select('*').eq('store_id', STORE).order('name').range(f, f + 999);
      if (error) throw error;
      all = all.concat(data);
      if (data.length < 1000) break;
      f += 1000;
    }
    return all;
  })();

  const pStock = (async () => {
    const bs = {}; let f = 0;
    for (;;) {
      const { data, error } = await sb.from('branch_stock').select('product_id,stock_quantity,cost_price').eq('branch_id', BRANCH).range(f, f + 999);
      if (error) throw error;
      data.forEach(r => bs[r.product_id] = r);
      if (data.length < 1000) break;
      f += 1000;
    }
    return bs;
  })();

  const pCats = (async () => {
    const cr = await sb.from('categories').select('*').eq('store_id', STORE).order('sort_order').order('created_at');
    if (cr.error) throw cr.error;
    return cr.data;
  })();

  const [all, bs, cats] = await Promise.all([pProducts, pStock, pCats]);
  CATS = cats;
  P = all.map(p => ({ ...p, stock_quantity: bs[p.id] ? bs[p.id].stock_quantity : 0, cost_price: bs[p.id] ? +bs[p.id].cost_price : 0 }));
}

/* Выгрузка статистики за период */
async function stats(f, t, ids) {
  ids = ids || [BRANCH];
  const a = new Date(f + 'T00:00:00').toISOString(), b = new Date(t + 'T23:59:59.999').toISOString();
  const { data, error } = await sb.from('receipts')
    .select('id,total_amount,total_cogs,created_at,receipt_items(product_id,quantity,price_at_sale)')
    .eq('store_id', STORE).in('branch_id', ids).eq('deleted', false).gte('created_at', a).lte('created_at', b).order('created_at', { ascending: false }).limit(1000);
  if (error) throw error;
  
  const o = { n: data.length, rev: 0, cost: 0, u: 0, by: {}, list: data };
  data.forEach(s => {
    o.rev += +s.total_amount; o.cost += +s.total_cogs;
    (s.receipt_items || []).forEach(i => {
      o.u += i.quantity;
      const x = o.by[i.product_id] || (o.by[i.product_id] = { u: 0, rev: 0 });
      x.u += i.quantity; x.rev += i.quantity * i.price_at_sale;
    });
  });
  o.rev = r2(o.rev); o.cost = r2(o.cost); o.gp = r2(o.rev - o.cost);
  return o;
}

/* 
=========================================================
 4. ШАБЛОНЫ ОТРИСОВКИ ИНТЕРФЕЙСА (Views)
=========================================================
*/
// Шаблон фото в списке товаров
const ph=p=>p.photo?`<img class="th" src="${esc(p.photo)}" alt="" loading="lazy">`:'<div class="ph">📦</div>';

// Шаблон строки товара
const row = p => `<div class="c r" onclick="pform(G('${p.id}'))" style="cursor:pointer">${ph(p)}<div class="f"><b>${esc(nm(p))}</b><small>${esc([catPath(p), p.barcode].filter(Boolean).join(' · '))}</small></div><div style="text-align:right"><b class="${p.stock_quantity <= LOW ? 'lo' : ''}">${p.stock_quantity} шт</b><br><small>${p.retail_price ? fmt(p.retail_price) : 'без цены'}</small></div></div>`;

// Шаблон верхней панели поиска с кнопками "Найти" и "Камера"
function cartHtml() {
  const h = S.cart.map((l, i) => {
    const p = G(l.id);
    return `<div class="c"><div class="r"><div class="f"><b>${esc(nm(p))}</b><small class="${p && p.stock_quantity < l.q ? 'lo' : ''}">остаток ${p ? p.stock_quantity : 0}</small></div><button class="x" aria-label="Убрать" onclick="S.cart.splice(${i},1);render()">✕</button></div>
      <div class="r" style="margin-top:8px"><button class="x" onclick="sq(${i},-1)">−</button><b class="q">${l.q}</b><button class="x" onclick="sq(${i},1)">+</button><input class="pi" inputmode="decimal" aria-label="Цена" value="${esc(l.price)}" onchange="S.cart[${i}].price=this.value.replace(',','.');render()"><span class="lt">${fmt(l.q * (+l.price || 0))}</span></div></div>`;
  }).join('');
  return h + (h ? `<div class="tot"><span>Итого</span><b>${fmt(cartTotal())}</b></div><button class="pb big" onclick="sell()">Продать</button>` : '');
}
const scanbar = m => `<div class="sb"><input id="sq" placeholder="${m === 'sale' ? 'Название или штрихкод' : 'Штрихкод или название'}" inputmode="search" value="${m === 'sale' ? esc(S.sq || '') : ''}" ${m === 'sale' ? 'oninput="qs(this.value)"' : ''} onkeydown="if(event.key==='Enter')look('${m}')"><button onclick="look('${m}')">Найти</button><button aria-label="Камера" onclick="scanBarcode('${m}')">📷</button></div>`;

// Объект V содержит функции отрисовки для каждой вкладки навигации
/* Кнопка «Новый документ» на вкладке и заголовки окна создания */
const WN = { cats: ['', '', 'Категории'], sale: ['Новая продажа', 'Продолжить продажу', 'Продажа'], buy: ['Новая закупка', 'Продолжить закупку', 'Закупка'], inv: ['Новая сверка', 'Продолжить сверку', 'Сверка остатков'] };
const newBtn = (w, n) => `<button class="pb big" style="margin:0 0 8px" onclick="openWin('${w}')">${n ? WN[w][1] + ' (' + n + ')' : WN[w][0]}</button>`;
function openWin(w) { if (w === 'sale') { S.cartView = false; S.sq = ''; S.cat = null; S.sub = null; S.lim = 30; } S.win = w; render(); const e = $('#win'); if (e) e.scrollTop = 0; }
function closeWin() { S.win = null; render(); }
if (tg && tg.BackButton) tg.BackButton.onClick(() => { if (S.win) closeWin(); });

/* ===== Категории и каталог ===== */
let CATS = [];
const topCats = () => CATS.filter(c => !c.parent_id);
const subCats = id => CATS.filter(c => c.parent_id === id);
const catById = id => CATS.find(c => c.id === id);
const catIds = id => { const c = catById(id); return c && !c.parent_id ? [id, ...subCats(id).map(x => x.id)] : [id]; };
const catCount = id => { const ids = new Set(catIds(id)); return P.filter(p => ids.has(p.category_id)).length; };
const catPath = p => { const c = catById(p.category_id); if (!c) return ''; const par = c.parent_id ? catById(c.parent_id) : null; return par ? par.name + ' › ' + c.name : c.name; };
const byName = (a, b) => nm(a).localeCompare(nm(b), 'ru');
const cartTotal = () => S.cart.reduce((a, l) => a + l.q * (+l.price || 0), 0);

// Карточка товара в каталоге: нажатие добавляет в чек
const pcard = p => { const l = S.cart.find(x => x.id === p.id);
  return `<div class="c r" onclick="hit('sale',G('${p.id}'))" style="cursor:pointer">${ph(p)}<div class="f"><b>${esc(nm(p))}</b><small>${esc(catPath(p))}</small></div><div style="text-align:right"><b class="${p.stock_quantity <= LOW ? 'lo' : ''}">${p.stock_quantity} шт</b><br><small>${p.retail_price ? fmt(p.retail_price) : 'без цены'}</small></div>${l ? `<span class="bd">${l.q}</span>` : ''}</div>`; };
const prodList = l => { l = l.slice().sort(byName); return l.slice(0, S.lim).map(pcard).join('') + (l.length > S.lim ? `<button class="big" onclick="S.lim+=30;catRefresh()">Показать ещё (${l.length - S.lim})</button>` : ''); };
const catCard = (id, name, n) => `<div class="cc" onclick="selCat('${id}')"><b>${esc(name)}</b><small>${n} шт</small></div>`;

// Содержимое под строкой поиска: результаты поиска, карточки категорий или товары выбранной категории
function catalogBody() {
  const q = (S.sq || '').trim().toLowerCase();
  if (q) return prodList(P.filter(p => (p.name || '').toLowerCase().includes(q) || (p.barcode || '').includes(q)));
  if (!CATS.length) return prodList(P);
  if (S.cat === null) {
    const none = P.filter(p => !p.category_id).length;
    return `<div class="cg">${topCats().map(c => catCard(c.id, c.name, catCount(c.id))).join('')}${none ? catCard('__none', 'Без категории', none) : ''}${catCard('__all', 'Все товары', P.length)}</div>`;
  }
  const c = catById(S.cat), subs = c ? subCats(c.id) : [];
  const title = S.cat === '__all' ? 'Все товары' : S.cat === '__none' ? 'Без категории' : (c ? c.name : '');
  let list;
  if (S.cat === '__all') list = P; else if (S.cat === '__none') list = P.filter(p => !p.category_id);
  else { const ids = new Set(S.sub ? [S.sub] : catIds(S.cat)); list = P.filter(p => ids.has(p.category_id)); }
  return `<div class="r" style="margin:6px 0"><button class="sm" onclick="selCat(null)">← Категории</button><b class="f">${esc(title)}</b></div>`
    + (subs.length ? `<div class="chips"><button class="${S.sub ? '' : 'on'}" onclick="selSub(null)">Все</button>${subs.map(x => `<button class="${S.sub === x.id ? 'on' : ''}" onclick="selSub('${x.id}')">${esc(x.name)}</button>`).join('')}</div>` : '')
    + prodList(list);
}
function catRefresh() { const b = $('#sbody'); if (b) b.innerHTML = catalogBody(); }
function qs(v) { S.sq = v; S.lim = 30; catRefresh(); }               // поиск по мере ввода (без перерисовки окна)
function selCat(id) { S.cat = id; S.sub = null; S.lim = 30; catRefresh(); const w = $('#win'); if (w) w.scrollTop = 0; }
function selSub(id) { S.sub = id; S.lim = 30; catRefresh(); }

/* ===== Управление категориями (владелец) ===== */
const catRow = (c, i, n, sub) => `<div class="c r" style="${sub ? 'margin-left:18px' : ''}"><div class="f"><b>${esc(c.name)}</b><small>${catCount(c.id)} товаров</small></div><button class="x" aria-label="Выше" ${i === 0 ? 'disabled' : ''} onclick="catMove('${c.id}',-1)">↑</button><button class="x" aria-label="Ниже" ${i === n - 1 ? 'disabled' : ''} onclick="catMove('${c.id}',1)">↓</button><button class="x" aria-label="Переименовать" onclick="catEdit('${c.id}')">✎</button><button class="x" aria-label="Удалить" onclick="catDel('${c.id}')">🗑</button></div>`;
function catsHtml() {
  return `<div class="row"><button class="pb" onclick="catEdit(null,null)">＋ Новая категория</button></div>` + topCats().map((c, i, a) =>
    catRow(c, i, a.length, false) + subCats(c.id).map((x, j, b) => catRow(x, j, b.length, true)).join('')
    + `<div style="margin:0 0 12px 18px"><button class="sm" onclick="catEdit(null,'${c.id}')">＋ Подкатегория</button></div>`).join('');
}
function catEdit(id, parent) {
  const c = id ? catById(id) : null; T = { id, parent };
  modal(`<h2>${c ? 'Переименовать' : parent ? 'Новая подкатегория' : 'Новая категория'}</h2><label>Название<input id="cn" value="${esc(c ? c.name : '')}"></label><div class="row"><button onclick="closeModal()">Отмена</button><button class="pb" onclick="catSave()">Сохранить</button></div>`);
}
async function createCat(name, parent) {
  const sib = CATS.filter(x => (x.parent_id || null) === (parent || null));
  const { data, error } = await sb.from('categories').insert({ store_id: STORE, parent_id: parent || null, name, sort_order: sib.length ? Math.max(...sib.map(x => x.sort_order)) + 1 : 0 }).select().single();
  if (error) throw new Error(error.code === '23505' ? 'Такая категория уже есть' : error.message);
  return data.id;
}
function catSave() {
  run(async () => {
    const name = $('#cn').value.trim(); if (!name) throw new Error('Введите название');
    if (T.id) { const { error } = await sb.from('categories').update({ name }).eq('id', T.id); if (error) throw new Error(error.code === '23505' ? 'Такая категория уже есть' : error.message); }
    else await createCat(name, T.parent);
    closeModal(); await load();
  });
}
function catMove(id, d) {
  run(async () => {
    const c = catById(id), sib = CATS.filter(x => (x.parent_id || null) === (c.parent_id || null)), i = sib.findIndex(x => x.id === id), j = i + d;
    if (j < 0 || j >= sib.length) return;
    [sib[i], sib[j]] = [sib[j], sib[i]];
    for (let k = 0; k < sib.length; k++) if (sib[k].sort_order !== k) { const { error } = await sb.from('categories').update({ sort_order: k }).eq('id', sib[k].id); if (error) throw error; }
    await load();
  });
}
function catDel(id) {
  const c = catById(id), subs = subCats(id), n = catCount(id);
  if (subs.length) return modal(`<h2>Нельзя удалить «${esc(c.name)}»</h2><p class="mu">Сначала удалите её подкатегории (${subs.length}).</p><button class="big" onclick="closeModal()">Понятно</button>`);
  if (!n) return ask(`Удалить «${c.name}»?`, () => catRemove(id));
  const others = CATS.filter(x => x.id !== id);
  T = { id };
  modal(`<h2>В «${esc(c.name)}» ${n} товаров</h2><label>Перенести товары в<select id="mv" style="width:100%;min-height:48px;border-radius:12px;border:1px solid var(--br);background:var(--cd);color:var(--tx);padding:0 12px;font:inherit"><option value="">Без категории</option>${others.map(x => `<option value="${x.id}">${esc((x.parent_id ? (catById(x.parent_id) || {}).name + ' › ' : '') + x.name)}</option>`).join('')}</select></label><div class="row"><button onclick="closeModal()">Отмена</button><button class="pb" onclick="catMoveDel()">Перенести и удалить</button></div>`);
}
function catMoveDel() {
  run(async () => {
    const to = $('#mv').value || null;
    const u = await sb.from('products').update({ category_id: to }).eq('category_id', T.id).eq('store_id', STORE); if (u.error) throw u.error;
    await catRemoveNow(T.id); closeModal(); await load();
  });
}
async function catRemoveNow(id) { const { error } = await sb.from('categories').delete().eq('id', id); if (error) throw new Error(/foreign key/i.test(error.message) ? 'В категории остались товары или подкатегории' : error.message); }
function catRemove(id) { run(async () => { await catRemoveNow(id); await load(); }); }

/* Поля «Категория / Подкатегория» в карточке товара */
function catFields(cat, sub) {
  const own = ROLE !== 'cashier';
  const opt = (v, t, sel) => `<option value="${v}" ${sel ? 'selected' : ''}>${esc(t)}</option>`;
  const st = 'width:100%;min-height:48px;border-radius:12px;border:1px solid var(--br);background:var(--cd);color:var(--tx);padding:0 12px;font:inherit;margin-top:4px';
  let h = `<label>Категория<select id="fc" style="${st}" onchange="catChange()">${opt('', '— без категории —', !cat)}${topCats().map(c => opt(c.id, c.name, c.id === cat)).join('')}${own ? opt('__new', '＋ Новая категория…', cat === '__new') : ''}</select></label><input id="fcn" placeholder="Название новой категории" style="display:${cat === '__new' ? 'block' : 'none'};margin-bottom:10px">`;
  const subs = cat && cat !== '__new' ? subCats(cat) : [];
  if (cat && cat !== '__new' && (subs.length || own))
    h += `<label>Подкатегория<select id="fs" style="${st}" onchange="catChange()">${opt('', '— без подкатегории —', !sub)}${subs.map(c => opt(c.id, c.name, c.id === sub)).join('')}${own ? opt('__new', '＋ Новая подкатегория…', sub === '__new') : ''}</select></label><input id="fsn" placeholder="Название новой подкатегории" style="display:${sub === '__new' ? 'block' : 'none'};margin-bottom:10px">`;
  return h;
}
function catChange() {
  const fc = $('#fc').value, fs = $('#fs') ? $('#fs').value : '', nc = $('#fcn') ? $('#fcn').value : '', ns = $('#fsn') ? $('#fsn').value : '';
  const same = fc === T.cat; T.cat = fc;
  $('#cf').innerHTML = catFields(fc, same ? fs : '');
  if ($('#fcn')) $('#fcn').value = nc; if ($('#fsn')) $('#fsn').value = ns;
}

/* ===== Филиалы ===== */
const RB = () => S.rb === 'all' ? BRANCHES.map(b => b.id) : [S.rb || BRANCH];
const switchers = () => {
  const bn = (BRANCHES.find(b => b.id === BRANCH) || {}).name || '';
  return `<div class="row" style="margin-top:-4px"><small style="flex:1;align-self:center">Филиал: <b>${esc(bn)}</b></small>${BRANCHES.length > 1 ? '<button class="sm" onclick="chooseBranch()">Сменить филиал</button>' : ''}${IS_ADMIN ? '<button class="sm" onclick="chooseStore()">Сменить магазин</button>' : ''}</div>`;
};
const rbSel = () => BRANCHES.length < 2 ? '' : `<label style="margin:0 0 8px">Филиал<select onchange="S.rb=this.value;render()" style="width:100%;min-height:48px;border-radius:12px;border:1px solid var(--br);background:var(--cd);color:var(--tx);padding:0 12px;font:inherit"><option value="all" ${S.rb === 'all' ? 'selected' : ''}>Все филиалы</option>${BRANCHES.map(b => `<option value="${b.id}" ${(S.rb || BRANCH) === b.id ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select></label>`;

const V = {
  async home() {
    const a = await stats(today(), today()), low = P.filter(p => p.stock_quantity <= LOW);
    return `<h1>${esc(STORE_NAME)}</h1>${switchers()}<div class="g owner-only"><div class="c w"><small>Продажи сегодня</small><b>${fmt(a.rev)}</b></div><div class="c"><small>Валовая прибыль</small><b>${fmt(a.gp)}</b></div><div class="c"><small>Продаж</small><b>${a.n}</b></div></div><h2>Заканчивается</h2>${low.map(row).join('') || '<p class="mu">Всё в наличии</p>'}<p class="mu" style="text-align:center"><small>Версия ${APP_VERSION}</small></p>`;
  },
  prod() { 
    return `<h1>Товары</h1><div class="row"><button class="pb owner-only" onclick="pform({})">Новый товар</button><button class="owner-only" onclick="openWin('cats')">Категории</button><button class="x" aria-label="Сканер" onclick="scanBarcode('prod')" style="flex:none;width:48px;font-size:22px">📷</button></div><input id="ps" placeholder="Поиск" oninput="plist()"><div id="pl"></div>`; 
  },
  catsForm() { return catsHtml(); },
  saleForm() {
    if (S.cartView) return scanbar('sale') + cartHtml() + `<button class="big" onclick="S.cartView=false;render()">← Добавить товары</button>`;
    const n = S.cart.reduce((a, l) => a + l.q, 0);
    return scanbar('sale') + `<div id="sbody">${catalogBody()}</div>` + (S.cart.length ? `<div class="cbar"><button class="pb big" onclick="S.cartView=true;render()">Чек: ${n} шт · ${fmt(cartTotal())}</button></div>` : '');
  },
  buyForm() {
    let u = 0, t = 0;
    const h = S.pcart.map((l, i) => {
      const p = G(l.id); u += +l.q || 0; t += (+l.q || 0) * (+l.cost || 0);
      return `<div class="c"><div class="r"><div class="f"><b>${esc(nm(p))}</b><small>остаток ${p ? p.stock_quantity : 0}${p && p.cost_price ? ' · себестоимость ' + fmt(p.cost_price) : ''}</small></div><button class="x" aria-label="Убрать" onclick="S.pcart.splice(${i},1);render()">✕</button></div>
      <div class="r" style="margin-top:8px"><label style="flex:1;margin:0">Закупочная цена за шт<input inputmode="decimal" value="${esc(l.cost)}" onchange="S.pcart[${i}].cost=this.value.replace(',','.');render()"></label><label style="flex:1;margin:0">Кол-во<input inputmode="numeric" value="${esc(l.q)}" onchange="S.pcart[${i}].q=this.value;render()"></label></div></div>`;
    }).join('');
    return scanbar('buy') + (h ? h + `<div class="c"><div class="bar"><span>Позиций / штук</span><b>${S.pcart.length} / ${u}</b></div><div class="bar"><span>Сумма закупки</span><b>${fmt(t)}</b></div></div><button class="pb big" onclick="buyAsk()">Подтвердить закупку</button>` : '');
  },
  invForm() {
    const it = Object.entries(S.inv);
    return scanbar('inv') + it.map(([id, x]) => {
      const p = G(id), d = x.cnt - p.stock_quantity;
      return `<div class="c"><div class="r"><div class="f"><b>${esc(nm(p))}</b><small>по учёту ${p.stock_quantity} шт</small></div><b class="${d < 0 ? 'lo' : d > 0 ? 'wa' : 'ok'}">${d > 0 ? '+' : ''}${d}</b></div>
      <div class="r" style="margin-top:8px"><label style="flex:1;margin:0">Посчитано<input inputmode="numeric" value="${x.cnt}" onchange="setc('${id}',this.value)"></label>${p.stock_quantity <= 0 ? `<label style="flex:1;margin:0">Закупочная цена<input inputmode="decimal" value="${esc(x.cost)}" onchange="S.inv['${id}'].cost=this.value.replace(',','.')"></label>` : ''}<button class="x" aria-label="Убрать" onclick="delete S.inv['${id}'];render()">✕</button></div></div>`;
    }).join('') + (it.length ? `<button class="pb big" onclick="ask('Применить сверку остатков? Остатки изменятся.',invOk)">Подтвердить сверку</button>` : '');
  },
  sale() { return newBtn('sale', S.cart.length) + journal('s'); },
  buy() { return newBtn('buy', S.pcart.length) + journal('p'); },
  inv() { return newBtn('inv', Object.keys(S.inv).length) + journal('i'); },
  async rep() {
    const a = await stats(S.from, S.to, RB());
    return `<h1>Отчёты</h1>${rbSel()}<div class="r"><label style="flex:1;margin:0">С<input type="date" value="${S.from}" onchange="S.from=this.value||today();render()"></label><label style="flex:1;margin:0">По<input type="date" value="${S.to}" onchange="S.to=this.value||today();render()"></label></div>
    <div class="g" style="margin-top:10px">
      <div class="c w"><small>Выручка</small><b>${fmt(a.rev)}</b></div>
      <div class="c"><small>Себестоимость</small><b>${fmt(a.cost)}</b></div>
      <div class="c"><small>Валовая прибыль</small><b>${fmt(a.gp)}</b></div>
      <div class="c"><small>Маржа</small><b>${a.rev ? r2(a.gp / a.rev * 100) : 0}%</b></div>
      <div class="c"><small>Продаж / штук</small><b>${a.n} / ${a.u}</b></div>
      <div class="c w"><small>Средний чек</small><b>${fmt(a.n ? a.rev / a.n : 0)}</b></div>
    </div>`;
  }
};

/* Главная функция обновления DOM */
async function render() {
  $('#nav').style.display = 'flex';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  const t = S.tab, h = await V[t]();
  if (t !== S.tab) return;
  $('#app').innerHTML = h;
  const w = $('#win');
  if (S.win && V[S.win + 'Form']) {
    w.innerHTML = `<div class="wi"><div class="wh"><button onclick="closeWin()">← Назад</button><b>${WN[S.win][2]}</b></div>` + V[S.win + 'Form']() + '</div>';
    w.hidden = false;
  } else { w.hidden = true; w.innerHTML = ''; }
  try { if (tg && tg.BackButton) S.win ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
  if (t === 'prod') plist();
}

/* Смена вкладки */
function go(t) { 
  S.win = null; S.tab = t; 
  render().catch(e => toast(e.message, 'er')); 
  // Если для вкладки есть документы (чеки), загружаем их
  if (TK[t]) loadDocs(TK[t]).then(render).catch(e => toast(e.message, 'er')); 
  scrollTo(0, 0); 
}

/* Локальный поиск по товарам на вкладке "Товары" */
function plist() {
  const q = ($('#ps')?.value || '').toLowerCase();
  $('#pl').innerHTML = P.filter(p => !q || (p.name || '').toLowerCase().includes(q) || (p.barcode || '').includes(q)).map(row).join('');
}


/* 
=========================================================
 5. РАБОТА С ДОКУМЕНТАМИ (Чеки, Закупки, Инвентаризация)
=========================================================
*/
const DK = { s: ['receipts', 'receipt_items(id,product_id,quantity,price_at_sale,cost_at_sale)', 'receipt_items'], p: ['purchases', 'purchase_items(id,product_id,quantity,cost)', 'purchase_items'], i: ['inventories', 'inventory_items(id,product_id,book_qty,counted_qty,delta,cost)', 'inventory_items'] };

// Локальный поиск по массиву кэша товаров (P)
function find(q) {
  q = q.trim(); if (!q) return [];
  const l = q.toLowerCase();
  const a = P.filter(p => p.barcode === q); if (a.length) return a;
  return P.filter(p => (p.name || '').toLowerCase().includes(l));
}

// Обработка ручного поиска (когда нажали кнопку "Найти")
function look(m) {
  const e = $('#sq'), v = e.value;
  if (m === 'sale') { const l = find(v); if (l.length > 1 && !l.every(p => p.barcode === v.trim())) return; S.sq = ''; }  // несколько совпадений по названию — выбор в списке под строкой
  e.value = ''; code(m, v);
}

// Обработка штрихкода (введенного вручную или со сканера)
function code(m, v) {
  v = v.trim(); if (!v) return;
  const l = find(v);
  
  // Если товар не найден - предлагаем создать новый (заполняя штрихкод)
  if (!l.length) { closeCam(); return pform(/^\d{6,}$/.test(v) ? { barcode: v } : { name: v }, m === 'prod' ? null : p => hit(m, p)); }
  // Если найден ровно один товар - сразу добавляем в корзину
  if (l.length === 1) { return hit(m, l[0]); }
  // Если найдено несколько (по совпадению имени) - показываем модальное окно выбора
  closeCam(); T = { l, cb: p => hit(m, p) };
  modal('<h2>Выберите товар</h2>' + l.map((p, i) => `<div class="c r" onclick="closeModal();T.cb(T.l[${i}])" style="cursor:pointer"><div class="f"><b>${esc(nm(p))}</b><small>${esc(p.barcode || '')}</small></div><b>${p.stock_quantity} шт</b></div>`).join(''));
}

// Добавление товара в нужную корзину (Продажа, Закупка, Сверка)
function hit(m, p) {
  if (m === 'prod') { closeCam(); return pform(p); } // на вкладке «Товары» сканирование открывает карточку
  if (m === 'sale') { const l = S.cart.find(x => x.id === p.id); if (l) l.q++; else S.cart.push({ id: p.id, q: 1, price: p.retail_price || '' }); }
  else if (m === 'buy') { const l = S.pcart.find(x => x.id === p.id); if (l) l.q = (+l.q || 0) + 1; else S.pcart.push({ id: p.id, q: 1, cost: p.cost_price || '' }); }
  else { const x = S.inv[p.id] || (S.inv[p.id] = { cnt: 0, cost: '' }); x.cnt++; }
  toast('+ ' + nm(p)); render();
}

/* 
=========================================================
 СКАНЕР ШТРИХКОДОВ (камера + barcode-detector)
=========================================================
iOS спрашивает доступ к камере при каждом getUserMedia, поэтому поток камеры держим открытым
между сканированиями (запрос появляется один раз) и отпускаем после CAM_IDLE_MS простоя.
*/
let CAMSTREAM = null, camIdle = null, CB = null;
const CAM_IDLE_MS = 3 * 60 * 1000;  // через сколько после закрытия сканера отпускать камеру
const BARCODE_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'qr_code']; // меньше форматов — быстрее

function releaseCam() { clearTimeout(camIdle); if (CAMSTREAM) { CAMSTREAM.getTracks().forEach(t => t.stop()); CAMSTREAM = null; } }

// Прогрев: заранее загружает модуль распознавания, чтобы первое сканирование не тормозило
function warmScanner() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 8;
    new BarcodeDetectionAPI.BarcodeDetector({ formats: ['ean_13'] }).detect(c).catch(() => {});
  } catch (e) {}
}

async function scanBarcode(m) {
  if (!navigator.mediaDevices?.getUserMedia) return toast('Камера недоступна', 'er');
  if (!window.BarcodeDetectionAPI) return toast('Модуль сканера не загружен — проверьте интернет', 'er');
  clearTimeout(camIdle);
  try {
    if (!CAMSTREAM || !CAMSTREAM.getVideoTracks().some(t => t.readyState === 'live'))
      CAMSTREAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } });
    $('#cam').hidden = false; // окно показываем только после получения доступа
    const box = $('#cvbox'); box.innerHTML = '';
    const v = document.createElement('video'); // новый <video> при каждом открытии
    v.setAttribute('playsinline', ''); v.muted = true;
    box.appendChild(v); v.srcObject = CAMSTREAM; await v.play();
    const det = new BarcodeDetectionAPI.BarcodeDetector({ formats: BARCODE_FORMATS });
    const c = { on: 1, last: '', lt: 0 }; CB = c;
    const loop = async () => {
      if (!c.on) return;
      try {
        if (v.readyState >= 2) {
          const r = await det.detect(v);
          if (c.on && r[0]) {
            const x = r[0].rawValue;
            // защита от повторного срабатывания на тот же штрихкод (2,5 сек)
            if (x !== c.last || Date.now() - c.lt > 2500) {
              c.last = x; c.lt = Date.now();
              if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); else if (navigator.vibrate) navigator.vibrate(50);
              closeCam();   // сразу скрываем камеру
              code(m, x);   // добавляем товар (или открываем форму нового)
              return;       // останавливаем цикл
            }
          }
        }
      } catch (e) {}
      if (c.on) setTimeout(loop, 100);
    };
    loop();
  } catch (e) {
    closeCam(); releaseCam();
    toast('Камера недоступна или доступ запрещён', 'er');
  }
}

function closeCam() {
  if (CB) { CB.on = 0; CB = null; clearTimeout(camIdle); camIdle = setTimeout(releaseCam, CAM_IDLE_MS); }
  const v = $('#cvbox video'); if (v) { v.pause(); v.srcObject = null; v.remove(); } // дорожки камеры не останавливаем — иначе iOS снова спросит доступ
  $('#cam').hidden = true;
}

// Генератор UUID для надежного создания ID товара на клиенте
function genUUID() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
    const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

// Конвертер Data URL в Blob для отправки в Supabase Storage
async function dataUrlToBlob(dataUrl) {
  try {
    return await (await fetch(dataUrl)).blob();
  } catch (e) {
    const parts = dataUrl.split(',');
    const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
    const bin = atob(parts[1]);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
}

function pform(p, cb) {
  const pc = catById(p.category_id), cat0 = pc ? (pc.parent_id || pc.id) : '', sub0 = pc && pc.parent_id ? pc.id : '';
  T = { photo: p.photo || null, photoBlob: null, photoDeleted: false, cb, cat: cat0 }; const e = !!p.id;

    </div>

    <input id="pf" type="file" accept="image/*" capture="environment" hidden onchange="photo(this)">

  <div class="row"><button onclick="closeModal()">Отмена</button><button class="pb" onclick="psave('${p.id || ''}')">Сохранить</button></div>`);

function delPhoto(e) {
  if (e) e.stopPropagation();
  if (!T) return;
  T.photo = null;
  T.photoBlob = null;
  T.photoDeleted = true;
  $('#pp').innerHTML = `<div style="padding:40px 0;color:var(--mu);font-size:32px">📷<br><small style="font-size:14px">Добавить фото</small></div>`;
  const pd = $('#pdel'); if (pd) pd.innerHTML = '';
}

// Изменение размера и компрессия фотографии перед отправкой (600px для четкости на экранах телефонов)
function photo(inp) {
  const f = inp.files[0]; if (!f) return;
  if (!/^image\//.test(f.type) || f.size > 20e6) return toast('Нужна картинка до 20 МБ', 'er');
  const im = new Image(), u = URL.createObjectURL(f);
  im.onload = () => {
    const maxSide = 600;
    const k = Math.min(1, maxSide / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u);
    const dataUrl = c.toDataURL('image/jpeg', 0.8);
    T.photoDataUrl = dataUrl;
    T.photo = dataUrl;
    T.photoDeleted = false;
    $('#pp').innerHTML = `<img src="${dataUrl}" style="width:100%;max-height:220px;object-fit:contain;display:block" alt="">`;
    const pd = $('#pdel'); if (pd) pd.innerHTML = '<button type="button" class="sm" style="color:var(--er);background:transparent" onclick="delPhoto(event)">Удалить фото</button>';
    if (c.toBlob) {
      c.toBlob(b => { T.photoBlob = b; }, 'image/jpeg', 0.8);
    } else {
      dataUrlToBlob(dataUrl).then(b => { T.photoBlob = b; });
    }
  };
  im.onerror = () => toast('Не удалось прочитать фото', 'er'); im.src = u;
}

// Сохранение карточки товара в БД + выгрузка фото в Supabase Storage
function psave(id) {
  run(async () => {
    const n = $('#fn').value.trim(), b = $('#fb').value.trim(), r = num($('#fp').value);
    if (!n && !b) throw new Error('Укажите название или штрихкод');
    if (r === false) throw new Error('Цена указана неверно');
    if (b && P.some(x => x.barcode === b && x.id !== id)) throw new Error('Такой штрихкод уже есть');
    // категория необязательна: подкатегория → иначе категория → иначе без категории; владелец может создать новую прямо здесь
    let catId = null; const fc = $('#fc').value, fs = $('#fs') ? $('#fs').value : '';
    if (fc === '__new') { const nn = $('#fcn').value.trim(); if (!nn) throw new Error('Введите название категории'); catId = await createCat(nn, null); }
    else if (fc) { catId = fc; if (fs === '__new') { const nn = $('#fsn').value.trim(); if (!nn) throw new Error('Введите название подкатегории'); catId = await createCat(nn, fc); } else if (fs) catId = fs; }

    const prodId = id || genUUID();
    let photoUrl = T.photo || null;

    if (T.photoDeleted) {
      photoUrl = null;
    } else if (T.photoBlob) {
      const filePath = `${STORE}/${prodId}.jpg`;
      try {
        const { error: upErr } = await sb.storage.from('product-photos').upload(filePath, T.photoBlob, {
          contentType: 'image/jpeg',
          upsert: true
        });
        if (upErr) throw upErr;
        const { data: pubData } = sb.storage.from('product-photos').getPublicUrl(filePath);
        photoUrl = pubData.publicUrl + '?t=' + Date.now();
      } catch (stErr) {
        console.warn('Storage upload error, using fallback:', stErr);
        photoUrl = T.photoDataUrl || T.photo || null;
      }
    }

    const row_data = { name: n || null, barcode: b || null, retail_price: r, photo: photoUrl, category_id: catId };
    const cb = T && T.cb; let p = null;
    if (id) {
      const { error } = await sb.from('products').update(row_data).eq('id', id).eq('store_id', STORE);
      if (error) throw error;
    } else {
      const { data, error } = await sb.from('products').insert({ id: prodId, ...row_data, store_id: STORE }).select().single();
      if (error) throw error;
      p = data;
    }
    closeModal();
    await load();
    saveCachedCatalog();
    toast('Товар сохранён', 'ok');
    if (cb && p) cb(G(p.id));
  });
}

/* Вход в функцию auth-store. Админ платформы без store_id получает список магазинов, с store_id — токен на выбранный магазин */

const AUTH_KEY_PREFIX = 'qr_auth_';
const CAT_KEY_PREFIX = 'qr_cat_';

function getUserId() {
  return (window.Telegram?.WebApp?.initDataUnsafe?.user?.id) || 'local';
}

function getCachedAuth() {
  try {
    const raw = localStorage.getItem(AUTH_KEY_PREFIX + getUserId());
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || !d.token) return null;
    let exp = d.exp;
    if (!exp) {
      try { exp = JSON.parse(atob(d.token.split('.')[1])).exp; } catch (_) {}
    }
    const now = Math.floor(Date.now() / 1000);
    if (exp && now < exp - 300) return d;
  } catch (e) {}
  return null;
}

function saveCachedAuth(d) {
  try {
    let exp = 0;
    try { exp = JSON.parse(atob(d.token.split('.')[1])).exp; } catch (_) {
      exp = Math.floor(Date.now() / 1000) + (d.expires_in || 21600);
    }
    localStorage.setItem(AUTH_KEY_PREFIX + getUserId(), JSON.stringify({ ...d, exp }));
  } catch (e) {}
}

function clearCachedAuth() {
  try { localStorage.removeItem(AUTH_KEY_PREFIX + getUserId()); } catch (e) {}
}

function loadCachedCatalog() {
  try {
    const raw = localStorage.getItem(CAT_KEY_PREFIX + STORE + '_' + BRANCH);
    if (!raw) return false;
    const c = JSON.parse(raw);
    if (Array.isArray(c.P) && c.P.length > 0) {
      P = c.P;
      CATS = c.CATS || [];
      return true;
    }
  } catch (e) {}
  return false;
}

function saveCachedCatalog() {
  try {
    localStorage.setItem(CAT_KEY_PREFIX + STORE + '_' + BRANCH, JSON.stringify({ P, CATS, t: Date.now() }));
  } catch (e) {
    try {
      const lightP = P.map(p => ({ ...p, photo: (p.photo && p.photo.startsWith('data:image')) ? null : p.photo }));
      localStorage.setItem(CAT_KEY_PREFIX + STORE + '_' + BRANCH, JSON.stringify({ P: lightP, CATS, t: Date.now() }));
    } catch (_) {}
  }
}

// Автоматическая фоновая миграция старых Base64-фотографий в Supabase Storage (для владельца/админа)
async function migrateLegacyPhotos() {
  if (ROLE !== 'owner' && !IS_ADMIN) return;
  const legacy = P.filter(p => p.photo && typeof p.photo === 'string' && p.photo.startsWith('data:image'));
  if (!legacy.length) return;
  console.log(`[Storage] Найдено ${legacy.length} старых фото в Base64. Фоновная выгрузка в Storage...`);
  let migrated = 0;
  for (const p of legacy) {
    try {
      const blob = await dataUrlToBlob(p.photo);
      const filePath = `${STORE}/${p.id}.jpg`;
      const { error: upErr } = await sb.storage.from('product-photos').upload(filePath, blob, {
        contentType: 'image/jpeg',
        upsert: true
      });
      if (upErr) {
        console.warn(`[Storage] Пропуск фото для ${p.name || p.id}:`, upErr.message);
        continue;
      }
      const { data: pubData } = sb.storage.from('product-photos').getPublicUrl(filePath);
      const newUrl = pubData.publicUrl + '?t=' + Date.now();
      const { error: dbErr } = await sb.from('products').update({ photo: newUrl }).eq('id', p.id).eq('store_id', STORE);
      if (!dbErr) {
        p.photo = newUrl;
        migrated++;
      }
    } catch (e) {
      console.warn(`[Storage] Ошибка миграции фото товара ${p.id}:`, e);
    }
  }
  if (migrated > 0) {
    console.log(`[Storage] Успешно перенесено ${migrated} фото в Storage!`);
    saveCachedCatalog();
  }
}

async function authCall(storeId) {
  const { data, error } = await sb0.functions.invoke('auth-store', { body: { initData: tg.initData, store_id: storeId || undefined } });
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch (e) {} throw new Error(m); }
  if (!data) throw new Error('Пустой ответ сервера');
  if (data.error) throw new Error(data.error);
  return data;
}

function applyAuth(d) {
  if (!d.token) throw new Error('Сервер не выдал токен — обновите функцию auth-store');
  saveCachedAuth(d);
  STORE = d.store_id; USER = d.telegram_id; ROLE = d.role; IS_ADMIN = !!d.is_admin; STORE_NAME = d.store_name || STORE_NAME; BRANCHES = d.branches || [];
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { global: { headers: { Authorization: 'Bearer ' + d.token } } });
  document.body.classList.toggle('cashier-mode', ROLE === 'cashier');
}

async function relogin() {
  clearCachedAuth();
  applyAuth(await authCall(IS_ADMIN ? STORE : null));
}

function showLoading(t = 'Подгружаем товары…', s = 'Пожалуйста, подождите…') {
  $('#nav').style.display = 'none'; $('#win').hidden = true;
  $('#app').innerHTML = `<div style="text-align:center;padding:80px 16px"><div class="spinner"></div><h2 style="margin:0 0 8px">${esc(t)}</h2><p class="mu" style="margin:0">${esc(s)}</p></div>`;
}

function showPicker(title, items, onPick, extra) {
  $('#nav').style.display = 'none'; $('#win').hidden = true;
  $('#app').innerHTML = `<h1>${esc(title)}</h1>` + items.map((x, i) => `<button class="big" style="margin:6px 0" onclick="PICK(${i})">${esc(x.name)}${x.sub ? ' <small>' + esc(x.sub) + '</small>' : ''}</button>`).join('') + (extra || '');
  window.PICK = i => onPick(items[i]);
}

async function enterStore(d) {
  applyAuth(d);
  let saved = null; try { saved = localStorage.getItem('branch_' + STORE); } catch (e) {}
  const b = BRANCHES.find(x => x.id === saved) || (BRANCHES.length === 1 ? BRANCHES[0] : null);
  if (b) return enterBranch(b);
  showPicker('Выберите филиал', BRANCHES, enterBranch, IS_ADMIN ? '<button class="big" onclick="chooseStore()">← Другой магазин</button>' : '');
}

async function enterBranch(b) {
  BRANCH = b.id; try { localStorage.setItem('branch_' + STORE, b.id); } catch (e) {}
  S.rb = null; S.docs = {}; S.cart = []; S.pcart = []; S.inv = {}; S.win = null; S.tab = 'home';
  
  // МГНОВЕННЫЙ запуск из локального кэша
  const hasCache = loadCachedCatalog();
  if (hasCache) {
    render();
  } else {
    showLoading('Подгружаем товары…', b.name || '');
  }

  // Фоновая синхронизация с сервером
  try {
    await load();
    saveCachedCatalog();
    await render();
    setTimeout(migrateLegacyPhotos, 1500);
  } catch (e) {
    if (!hasCache) toast(e.message || String(e), 'er');
  }
}

async function chooseStore() {
  clearCachedAuth();
  showLoading('Загружаем список магазинов…');
  try {
    const d = await authCall(null);
    showPicker('Выберите магазин', d.stores.map(s => ({ id: s.id, name: s.name, sub: s.sub_status === 'inactive' ? 'подписка неактивна' : '' })),
      async s => {
        showLoading('Подгружаем товары…', s.name);
        try { await enterStore(await authCall(s.id)); } catch (e) { toast(e.message, 'er'); }
      });
  } catch (e) { toast(e.message, 'er'); }
}

function chooseBranch() { showPicker('Выберите филиал', BRANCHES, enterBranch, '<button class="big" onclick="render()">Отмена</button>'); }

/* Старт приложения */
async function startApp() {
  if (!tg || !tg.initData) { $('#app').innerHTML = '<h1>Откройте в Telegram</h1><p class="mu">Приложение работает только внутри Telegram.</p>'; return; }
  
  // 1. Проверяем валидный кэш токена в телефоне (мгновенный вход без запроса к auth-store)
  const cachedAuth = getCachedAuth();
  if (cachedAuth && cachedAuth.token && cachedAuth.store_id) {
    try {
      applyAuth(cachedAuth);
      await enterStore(cachedAuth);
      warmScanner();
      return;
    } catch (e) {
      clearCachedAuth();
    }
  }

  // 2. Вход через сервер при первом запуске или истечении токена (>6 часов)
  try {
    const d = await authCall(null);
    if (d.pick_store) { IS_ADMIN = true; await chooseStoreFrom(d); return; }
    await enterStore(d); toast('Вход выполнен', 'ok'); warmScanner();
  } catch (e) {
    $('#app').innerHTML = `<h1>Ошибка входа</h1><p class="mu">${esc(e.message)}</p><button class="pb big" onclick="location.reload()">Повторить</button>`;
  }
}

async function chooseStoreFrom(d) {
  showPicker('Выберите магазин', d.stores.map(s => ({ id: s.id, name: s.name, sub: s.sub_status === 'inactive' ? 'подписка неактивна' : '' })),
    async s => {
      showLoading('Подгружаем товары…', s.name);
      try { await enterStore(await authCall(s.id)); warmScanner(); } catch (e) { toast(e.message, 'er'); }
    });
}

// Запуск
startApp();
</script>
