<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Магазин (SaaS Ready)</title>
<style>
:root{--bg:#f4f5f2;--cd:#fff;--tx:#1c2321;--mu:#68716d;--br:#dfe3de;--pr:#0f766e;--pt:#fff;--ok:#15803d;--er:#b42318;--wa:#b45309;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121615;--cd:#1c2220;--tx:#eef2ef;--mu:#9aa5a0;--br:#2c3532;--pr:#2dd4bf;--pt:#06201c;--ok:#4ade80;--er:#f87171;--wa:#fbbf24}}
:root[data-theme="dark"]{--bg:#121615;--cd:#1c2220;--tx:#eef2ef;--mu:#9aa5a0;--br:#2c3532;--pr:#2dd4bf;--pt:#06201c;--ok:#4ade80;--er:#f87171;--wa:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:24px;margin:6px 0 12px}h2{font-size:17px;margin:20px 0 8px}
small,.mu{color:var(--mu);font-size:13px}p.mu{padding:10px 0}
button,input{font:inherit;color:inherit}
button{min-height:48px;padding:0 16px;border:1px solid var(--br);background:var(--cd);border-radius:12px;cursor:pointer}
button.pb{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:600}
button.big{width:100%;min-height:56px;font-size:18px;margin-top:12px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
input{width:100%;min-height:48px;padding:0 12px;border:1px solid var(--br);border-radius:12px;background:var(--cd)}
label{display:block;margin:10px 0;font-size:14px;color:var(--mu)}label input{margin-top:4px;color:var(--tx)}
.ck{display:flex;gap:8px;align-items:center}.ck input{width:24px;min-height:24px}
.c{background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:12px;margin:10px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g .c{margin:0}.g b{display:block;font-size:22px}.g .w{grid-column:1/3}
.row,.r{display:flex;gap:8px;align-items:center}.row{margin:12px 0}.row button{flex:1}.f{flex:1;min-width:0}
.f b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph,.th{width:52px;height:52px;border-radius:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;object-fit:cover;font-size:20px}
.ph small{font-size:10px}
.sb{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:3}.sb input{flex:1}
.q{min-width:32px;text-align:center;font-size:20px}.pi{width:96px;text-align:right}.lt{flex:1;text-align:right;font-weight:600}
.x{min-height:40px;width:40px;padding:0}a{color:var(--pr);text-decoration:underline;font-size:13px;cursor:pointer;display:inline-block;margin-top:6px}
.tot{display:flex;justify-content:space-between;font-size:22px;padding:14px 4px 0}
.lo{color:var(--er)}.ok{color:var(--ok)}.wa{color:var(--wa)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--br);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:0 2px;color:var(--mu)}
nav button span{font-size:20px}nav button.on{color:var(--pr);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.ov[hidden],#cam[hidden]{display:none}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
#cam{position:fixed;inset:0;background:#000;z-index:8;display:flex;flex-direction:column}#cam video{flex:1;min-height:0;width:100%;object-fit:cover}
#cam div{padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));color:#fff;display:flex;gap:10px;align-items:center}#cam .f{color:#fff}
#toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;padding:12px 14px;border-radius:12px;background:var(--tx);color:var(--bg);display:none;text-align:center}
textarea{width:100%;height:180px;border-radius:12px;border:1px solid var(--br);background:var(--cd);color:var(--tx);font:12px monospace;padding:8px}
.bar{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px}.t{overflow-x:auto}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head><body>
<div id="app"></div>
<nav><button data-t="home" onclick="go('home')"><span>🏠</span>Главная</button><button data-t="sale" onclick="go('sale')"><span>🛒</span>Продажа</button><button data-t="buy" onclick="go('buy')"><span>📥</span>Закупка</button><button data-t="prod" onclick="go('prod')"><span>📦</span>Товары</button><button data-t="docs" onclick="go('docs')"><span>📄</span>Документы</button><button data-t="rep" onclick="go('rep')"><span>📊</span>Отчёты</button></nav>
<div id="cam" hidden><video id="cv" playsinline muted></video><div><span class="f" id="ct">Наведите на штрихкод</span><button onclick="closeCam()">Готово</button></div></div>
<div class="ov" id="md" hidden><div class="sh" id="mb"></div></div><div id="toast" role="status"></div>
<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const $=s=>document.querySelector(s),K='shop_saas_v2';

// --- ИМИТАЦИЯ СЕССИИ SAAS ---
const STORE_ID = 'store_demo_1';
const USER_ID = 10001; // telegram_id

let db=null;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=db||{
    stores: [{id: STORE_ID, name: 'Моя Розничная Точка', sub_status: 'active', created_at: Date.now()}],
    users: [{telegram_id: USER_ID, store_id: STORE_ID, role: 'owner', name: 'Владелец'}],
    products: [],
    stock_movements: [], // Заменил moves
    receipts: [],       // Заменил sales
    receipt_items: [],  // Новая таблица составов чеков
    purchases: [],
    invs: [],
    n: {}, seq: 0, inv: null
};
db.invs=db.invs||[];db.n=db.n||{};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const r2=n=>Math.round(n*100)/100,r4=n=>Math.round(n*1e4)/1e4;
const fmt=n=>r2(+n||0).toLocaleString('ru-RU')+' сом';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>dk(Date.now()),P=id=>db.products.find(p=>p.id===id),nm=p=>p.name||p.barcode||p.code;
const S={tab:'home',cart:[],pcart:[],from:today(),to:today(),df:'all',fix:null,pfix:null};
let T=null,tmr;
function toast(m,k){const t=$('#toast');t.textContent=m;t.style.display='block';t.style.background=k==='er'?'var(--er)':k==='ok'?'var(--ok)':'var(--tx)';t.style.color=k?'#fff':'var(--bg)';clearTimeout(tmr);tmr=setTimeout(()=>t.style.display='none',3200)}

function tx(fn){const snap=JSON.stringify(db);try{fn();localStorage.setItem(K,JSON.stringify(db));return true}catch(e){db=JSON.parse(snap);toast('Не сохранилось: '+(e&&e.name==='QuotaExceededError'?'память браузера заполнена':e.message||e),'er');return false}}
const wavg=(s,a,q,v)=>s<=0?r4(v/q):r4((s*a+v)/(s+q));

// ЗАМЕНА moves -> stock_movements с полями ER
const mv=(p,type,d,cost,src)=>db.stock_movements.push({id:uid(), store_id:STORE_ID, product_id:p.id, type, quantity:d, after:p.stock, cost, src, created_at:Date.now()});

const find=q=>{q=q.trim();if(!q)return[];const l=q.toLowerCase(),A=db.products.filter(p=>p.active);
let a=A.filter(p=>p.barcode===q);if(a.length)return a;a=A.filter(p=>p.code.toLowerCase()===l);if(a.length)return a;return A.filter(p=>(p.name||'').toLowerCase().includes(l))};

// ОБНОВЛЕНО: Чтение выручки из receipts и receipt_items
function sum(f,t){const o={n:0,rev:0,cost:0,gp:0,u:0,by:{}};
db.receipts.forEach(s=>{
    const d=dk(s.created_at);
    if(s.status!=='ok'||d<f||d>t)return;
    o.n++;o.rev+=s.total_amount;o.cost+=s.total_cogs;
    db.receipt_items.filter(i=>i.receipt_id===s.id).forEach(i=>{
        o.u+=i.quantity;
        const b=o.by[i.product_id]||(o.by[i.product_id]={u:0,rev:0});
        b.u+=i.quantity;b.rev+=i.quantity*i.price_at_sale;
    });
});
o.rev=r2(o.rev);o.cost=r2(o.cost);o.gp=r2(o.rev-o.cost);return o}

const ph=p=>p.photo?`<img class="th" src="${p.photo}" alt="">`:'<div class="ph">📦</div>';
const prow=p=>`<div class="c r" onclick="edit('${p.id}')" style="cursor:pointer">${ph(p)}<div class="f"><b>${esc(nm(p))}</b><small>${esc(p.barcode||p.code)}${p.v>1?' · вариант '+p.v:''}</small></div><div style="text-align:right"><b class="${p.stock<=p.low?'lo':''}">${p.stock} шт</b><br><small>${p.price==null?'без цены':fmt(p.price)}</small></div></div>`;
const scanbar=m=>`<div class="sb"><input id="sq" placeholder="Штрихкод, код или название" inputmode="search" onkeydown="if(event.key==='Enter')look('${m}')"><button onclick="look('${m}')">Найти</button><button aria-label="Камера" onclick="cam('${m}')">📷</button></div>`;

const V={
home(){const a=sum(today(),today()),low=db.products.filter(p=>p.active&&p.stock<=p.low);
return `<h1>Сегодня</h1><div class="g"><div class="c w"><small>Продажи</small><b>${fmt(a.rev)}</b></div><div class="c"><small>Валовая прибыль</small><b>${fmt(a.gp)}</b></div><div class="c"><small>Продаж</small><b>${a.n}</b></div></div>
<div class="row"><button class="pb" onclick="go('sale')">Продажа</button><button onclick="go('buy')">Закупка</button><button onclick="go('inv')">Пересчёт</button><button onclick="localStorage.removeItem('shop_saas_v2'); location.reload();" style="background: var(--er); color: white;">Сбросить БД</button></div>
<h2>Заканчивается</h2>${low.length?low.map(prow).join(''):'<p class="mu">'+(db.products.length?'Всё в наличии.':'Товаров пока нет. Добавьте их в разделе «Товары» или начните с закупки.')+'</p>'}`},
sale(){let t=0;const h=S.cart.map((l,i)=>{const p=P(l.pid);t+=l.q*(+l.price||0);return `<div class="c"><div class="r">${ph(p)}<div class="f"><b>${esc(nm(p))}</b><small>остаток ${avail(p)}</small></div><button class="x" aria-label="Убрать" onclick="S.cart.splice(${i},1);render()">✕</button></div>
<div class="r" style="margin-top:8px"><button class="x" onclick="sq(${i},-1)">−</button><b class="q">${l.q}</b><button class="x" onclick="sq(${i},1)">+</button><input class="pi" inputmode="decimal" aria-label="Цена" value="${esc(l.price)}" onchange="S.cart[${i}].price=this.value;render()"><span class="lt">${fmt(l.q*(+l.price||0))}</span></div>
${l.price!==''&&+l.price!==p.price?`<a onclick="defp(${i})">Сделать ценой по умолчанию (${fmt(l.price)})</a>`:''}</div>`}).join('');
return banner()+scanbar('sale')+(h?h+`<div class="tot"><span>Итого</span><b>${fmt(t)}</b></div><button class="pb big" onclick="sell()">Продать</button>`:'<p class="mu">Отсканируйте товар или введите код — он попадёт в чек.</p>')},
buy(){let n=0,u=0,t=0;const h=S.pcart.map((l,i)=>{const p=P(l.pid);n++;u+=+l.q||0;t+=(+l.q||0)*(+l.cost||0);return `<div class="c"><div class="r">${ph(p)}<div class="f"><b>${esc(nm(p))}</b><small>остаток ${p.stock}${p.last!=null?' · прошлая цена '+fmt(p.last):''}</small></div><button class="x" aria-label="Убрать" onclick="S.pcart.splice(${i},1);render()">✕</button></div>
<div class="r" style="margin-top:8px"><label style="flex:1;margin:0">Цена за шт<input inputmode="decimal" value="${esc(l.cost)}" onchange="S.pcart[${i}].cost=this.value;render()"></label><label style="flex:1;margin:0">Кол-во<input inputmode="numeric" value="${esc(l.q)}" onchange="S.pcart[${i}].q=this.value;render()"></label></div></div>`}).join('');
return pbanner()+scanbar('buy')+(h?h+`<div class="c"><div class="bar"><span>Позиций</span><b>${n}</b></div><div class="bar"><span>Штук</span><b>${u}</b></div><div class="bar"><span>Сумма закупки</span><b>${fmt(t)}</b></div></div><button class="pb big" onclick="buyAsk()">Подтвердить закупку</button><div class="row"><button onclick="ask('Очистить закупку? Остатки не изменятся.',()=>{S.pcart=[];render()})">Отменить</button></div>`:'<p class="mu">Сканируйте товары с рынка один за другим. Остатки изменятся только после подтверждения.</p>')},
prod(){return `<h1>Товары</h1><div class="row"><button class="pb" onclick="pform({})">Новый товар</button><button onclick="go('inv')">Пересчёт</button></div><input id="ps" placeholder="Поиск" oninput="plist()"><div id="pl"></div>`},
inv(){const v=db.inv;if(!v)return `<h1>Пересчёт</h1><p class="mu">Начальный — когда товар был до программы: задаёт стартовые остатки и цену. Обычный — сверка с учётом.</p><div class="row"><button class="pb" onclick="invStart('initial')">Начальный</button><button class="pb" onclick="invStart('regular')">Обычный</button></div>`;
const it=Object.entries(v.items);return `<h1>${v.type==='initial'?'Начальный пересчёт':'Пересчёт'}</h1>`+scanbar('inv')+(it.length?it.map(([id,x])=>{const p=P(id),d=x.cnt-x.book;return `<div class="c"><div class="r">${ph(p)}<div class="f"><b>${esc(nm(p))}</b><small>по учёту ${x.book} шт</small></div><b class="${d<0?'lo':d>0?'wa':'ok'}">${d>0?'+':''}${d}</b></div><div class="r" style="margin-top:8px"><label style="flex:1;margin:0">Посчитано<input inputmode="numeric" value="${x.cnt}" onchange="setc('${id}',this.value)"></label>${v.type==='initial'?`<label style="flex:1;margin:0">Цена закупки<input inputmode="decimal" value="${esc(x.cost)}" onchange="db.inv.items['${id}'].cost=this.value;tx(()=>0)"></label>`:''}<button class="x" aria-label="Убрать" onclick="delc('${id}')">✕</button></div></div>`}).join('')+`<button class="pb big" onclick="ask('Применить пересчёт? Остатки изменятся.',invOk)">Подтвердить пересчёт</button>`:'<p class="mu">Сканируйте товары — каждое сканирование прибавляет 1. Число можно исправить вручную.</p>')+`<div class="row"><button onclick="ask('Удалить черновик пересчёта?',()=>{tx(()=>db.inv=null);render()})">Удалить черновик</button></div>`},
docs(){const f=S.df,L=allDocs().filter(x=>f==='all'||x.k===f).slice(0,80);
return `<h1>Документы</h1><div class="row">${[['all','Все'],['s','Продажи'],['p','Закупки'],['i','Пересчёты']].map(([k,t])=>`<button class="${f===k?'pb':''}" onclick="S.df='${k}';render()">${t}</button>`).join('')}</div>`+(L.map(x=>{const st=x.d.status||'ok';const t_val = x.k==='s'?x.d.total_amount:x.d.total; return `<div class="c" onclick="openDoc('${x.d.id}')" style="cursor:pointer"><div class="bar"><b>${KIND[x.k][0]} № ${x.num}</b><b class="${st==='ok'?'':'lo'}">${st!=='ok'?'отменён':x.k==='i'?(x.d.type==='initial'?'начальный':'обычный'):fmt(t_val)}</b></div><small>${new Date(x.d.created_at).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · ${st==='ok'?'проведён':'проведение отменено'}${x.d.fixOf?' · исправляет № '+x.d.fixOf:''}</small></div>`}).join('')||'<p class="mu">Документов пока нет. Они появятся после первой продажи, закупки или пересчёта.</p>')},
rep(){const a=sum(S.from,S.to),A=db.products.filter(p=>p.active),top=A.filter(p=>a.by[p.id]).sort((x,y)=>a.by[y.id].u-a.by[x.id].u),no=A.filter(p=>!a.by[p.id]);
const val=r2(A.reduce((s,p)=>s+p.stock*p.avg,0)),ss=db.receipts.filter(s=>s.status!=='deleted'&&dk(s.created_at)>=S.from&&dk(s.created_at)<=S.to).sort((x,y)=>y.created_at-x.created_at);
return `<h1>Отчёты</h1><div class="r"><label style="flex:1;margin:0">С<input type="date" value="${S.from}" onchange="S.from=this.value||today();render()"></label><label style="flex:1;margin:0">По<input type="date" value="${S.to}" onchange="S.to=this.value||today();render()"></label></div>
<small>Даты — по времени устройства. Отменённые продажи не учитываются.</small>
<div class="g" style="margin-top:10px"><div class="c w"><small>Выручка</small><b>${fmt(a.rev)}</b></div><div class="c"><small>Себестоимость</small><b>${fmt(a.cost)}</b></div><div class="c"><small>Валовая прибыль</small><b>${fmt(a.gp)}</b></div><div class="c"><small>Маржа</small><b>${a.rev?r2(a.gp/a.rev*100):0}%</b></div><div class="c"><small>Продаж / штук</small><b>${a.n} / ${a.u}</b></div><div class="c w"><small>Средний чек</small><b>${fmt(a.n?a.rev/a.n:0)}</b></div></div>
<small>Валовая прибыль — это выручка минус закупочная стоимость; аренда, налоги и зарплаты не вычтены.</small>
<h2>Склад</h2><div class="c"><div class="bar"><span>Стоимость остатков</span><b>${fmt(val)}</b></div><div class="bar"><span>Мало на складе</span><b>${A.filter(p=>p.stock<=p.low).length} поз.</b></div></div>
<h2>Лучшие по штукам</h2>${top.slice(0,10).map(p=>`<div class="bar"><span>${esc(nm(p))}</span><b>${a.by[p.id].u} шт · ${fmt(a.by[p.id].rev)}</b></div>`).join('')||'<p class="mu">Нет продаж за период.</p>'}
<h2>Без продаж за период</h2>${no.slice(0,15).map(p=>`<div class="bar"><span>${esc(nm(p))}</span><b>${p.stock} шт</b></div>`).join('')||'<p class="mu">—</p>'}
<h2>Продажи</h2>${ss.map(s=>{const items=db.receipt_items.filter(i=>i.receipt_id===s.id); return `<div class="c" onclick="openDoc('${s.id}')" style="cursor:pointer"><div class="bar"><b>${new Date(s.created_at).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</b><b class="${s.status==='ok'?'':'lo'}">${s.status==='ok'?fmt(s.total_amount):'отменена'}</b></div><small>${items.map(i=>esc(nm(P(i.product_id)))+' ×'+i.quantity).join(', ')}</small></div>`}).join('')||'<p class="mu">Нет продаж за период.</p>'}
<div class="row"><button onclick="csv('s')">CSV продаж</button><button onclick="csv('k')">CSV склада</button></div>`}};
function render(){$('#app').innerHTML=V[S.tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));if(S.tab==='prod')plist()}
function go(t){closeCam();S.tab=t;render();scrollTo(0,0)}
function plist(){const q=($('#ps')?.value||'').toLowerCase(),a=db.products.filter(p=>!q||(p.name||'').toLowerCase().includes(q)||(p.barcode||'').includes(q)||p.code.toLowerCase().includes(q));$('#pl').innerHTML=a.map(prow).join('')||'<p class="mu">'+(db.products.length?'Ничего не найдено.':'Товаров пока нет. Нажмите «Новый товар» или сканируйте при закупке.')+'</p>'}
function modal(h){$('#mb').innerHTML=h;$('#md').hidden=false}function closeModal(){$('#md').hidden=true}
let ASK=null;function ask(t,y){ASK=y;modal(`<h2>${esc(t)}</h2><div class="row"><button onclick="closeModal()">Нет</button><button class="pb" onclick="closeModal();ASK()">Да</button></div>`)}
function pick(l,cb){if(l.length===1)return cb(l[0]);closeCam();T={l,cb};modal('<h2>Выберите товар</h2>'+l.map((p,i)=>`<div class="c r" onclick="closeModal();T.cb(T.l[${i}])" style="cursor:pointer">${ph(p)}<div class="f"><b>${esc(nm(p))}</b><small>${esc(p.barcode||p.code)}${p.v>1?' · вариант '+p.v:''}</small></div><b>${p.stock} шт</b></div>`).join(''))}
function look(m){const e=$('#sq'),v=e.value;e.value='';code(m,v)}
function code(m,v){if(!v.trim())return;const l=find(v);if(!l.length){closeCam();return nf(m,v.trim())}pick(l,p=>hit(m,p))}
function hit(m,p){if(m==='sale')addSale(p);else if(m==='buy')addBuy(p);else addCnt(p)}
function nf(m,v){const seed=/^\d{6,}$/.test(v)?{barcode:v}:{name:v};if(m==='sale')return modal(`<h2>Товар не найден</h2><p class="mu">«${esc(v)}» нет в базе. Новый товар сначала нужно оприходовать закупкой или пересчётом.</p><div class="row"><button onclick="closeModal()">Повторить</button><button class="pb" onclick="pform(${esc(JSON.stringify(seed)).replace(/&quot;/g,'&quot;')})">Новый товар</button></div>`);pform(seed,p=>hit(m,p))}
const avail=p=>p.stock+(S.fix?S.fix.q[p.id]||0:0);
const banner=()=>S.fix?`<div class="c"><b>Исправление продажи № ${S.fix.n}</b><br><small>Старая продажа заменится после сохранения. Пока не сохранили — ничего не изменилось.</small><br><a onclick="S.fix=null;S.cart=[];render()">Отменить исправление</a></div>`:'';
const pbanner=()=>S.pfix?`<div class="c"><b>Исправление закупки № ${S.pfix.n}</b><br><small>Старая закупка заменится после подтверждения. Пока не сохранили — ничего не изменилось.</small><br><a onclick="S.pfix=null;S.pcart=[];render()">Отменить исправление</a></div>`:'';
function addSale(p){const a=avail(p);if(a<=0)return toast('«'+nm(p)+'»: нет в наличии','er');const l=S.cart.find(x=>x.pid===p.id);if(l){if(l.q+1>a)return toast('Остаток всего '+a+' шт','er');l.q++}else S.cart.push({pid:p.id,q:1,price:p.price??''});toast('+ '+nm(p));render()}
function sq(i,d){const l=S.cart[i],p=P(l.pid),q=l.q+d;if(q<1)S.cart.splice(i,1);else if(q>avail(p))return toast('Остаток всего '+avail(p)+' шт','er');else l.q=q;render()}
function defp(i){const l=S.cart[i],p=P(l.pid);if(tx(()=>p.price=r2(+l.price)))toast('Цена по умолчанию обновлена','ok');render()}
const nx=(k,l)=>db.n[k]=(db.n[k]??l.length)+1;

// ОБНОВЛЕНО: Отмена продажи из receipt_items
function revSale(s){const items=db.receipt_items.filter(x=>x.receipt_id===s.id); items.forEach(i=>{const p=P(i.product_id);p.avg=wavg(p.stock,p.avg,i.quantity,i.quantity*i.cost_at_sale);p.stock+=i.quantity;mv(p,'sale_cancel',i.quantity,i.cost_at_sale,s.id)});s.status='cancelled'}

function revBuy(u){const need={};u.items.forEach(i=>need[i.pid]=(need[i.pid]||0)+i.q);for(const id in need)if(P(id).stock<need[id])throw new Error('Нельзя отменить: «'+nm(P(id))+'» уже продан (на складе '+P(id).stock+', в закупке '+need[id]+')');
u.items.forEach(i=>{const p=P(i.pid),r=p.stock-i.q;p.avg=r>0?Math.max(0,r4((p.stock*p.avg-i.q*i.cost)/r)):p.avg;p.stock=r;mv(p,'purchase_cancel',-i.q,i.cost,u.id)});u.status='cancelled'}
function revInv(v){v.items.forEach(i=>{if(P(i.pid).stock-i.delta<0)throw new Error('Нельзя отменить: «'+nm(P(i.pid))+'» уже продан')});v.items.forEach(i=>{if(!i.delta)return;const p=P(i.pid);p.stock-=i.delta;mv(p,'adjust_cancel',-i.delta,i.cost,v.id)});v.status='cancelled'}

// ОБНОВЛЕНО: Запись чеков в receipts и receipt_items
function sell(){const c=S.cart;if(!c.length)return;if(c.some(l=>l.price===''||!(+l.price>=0)))return toast('Укажите цену для каждого товара','er');
const old=S.fix&&db.receipts.find(x=>x.id===S.fix.id);
if(tx(()=>{
    if(old){if(old.status!=='ok')throw new Error('исходная продажа уже отменена');revSale(old)}
    const need={};c.forEach(l=>need[l.pid]=(need[l.pid]||0)+l.q);
    for(const id in need){const p=P(id);if(p.stock<need[id])throw new Error('не хватает «'+nm(p)+'» (есть '+p.stock+')')}
    const r_id = uid();
    const s={id:r_id, store_id:STORE_ID, user_id:USER_ID, n:nx('s',db.receipts), created_at:Date.now(), total_amount:0, total_cogs:0, status:'ok'};
    if(old)s.fixOf=S.fix.n;
    c.forEach(l=>{
        const p=P(l.pid),pr=r2(+l.price);
        db.receipt_items.push({id:uid(), receipt_id:r_id, product_id:p.id, quantity:l.q, price_at_sale:pr, cost_at_sale:p.avg});
        s.total_amount+=l.q*pr;
        s.total_cogs+=l.q*p.avg;
    });
    s.total_amount=r2(s.total_amount);s.total_cogs=r4(s.total_cogs);
    for(const id in need){const p=P(id);p.stock-=need[id];mv(p,'sale',-need[id],p.avg,s.id)}
    db.receipts.push(s);
})){S.cart=[];S.fix=null;toast('Продажа сохранена','ok');render()}}

function addBuy(p){const l=S.pcart.find(x=>x.pid===p.id);if(l)l.q=(+l.q||0)+1;else S.pcart.push({pid:p.id,q:1,cost:p.last??''});toast('+ '+nm(p));render()}

// ОБНОВЛЕНО: Закупки (сохранил старую логику для MVP, но добавил store_id и created_at)
function buyAsk(){const c=S.pcart;if(c.some(l=>l.cost===''||!(+l.cost>=0)||!(parseInt(l.q)>0)))return toast('Укажите цену и количество для каждой позиции','er');
ask(S.pfix?'Сохранить исправленную закупку? Старая будет отменена.':'Подтвердить закупку? Остатки увеличатся.',()=>{const old=S.pfix&&db.purchases.find(x=>x.id===S.pfix.id);if(tx(()=>{if(old){if((old.status||'ok')!=='ok')throw new Error('исходная закупка уже отменена');revBuy(old)}
const pu={id:uid(), store_id:STORE_ID, user_id:USER_ID, n:nx('p',db.purchases), created_at:Date.now(), items:[], total:0, status:'ok'};if(old)pu.fixOf=S.pfix.n;c.forEach(l=>{const p=P(l.pid),q=parseInt(l.q),co=r2(+l.cost);p.avg=wavg(p.stock,p.avg,q,q*co);p.stock+=q;p.last=co;mv(p,'purchase',q,co,pu.id);pu.items.push({pid:p.id,q,cost:co});pu.total+=q*co});pu.total=r2(pu.total);db.purchases.push(pu)})){S.pcart=[];S.pfix=null;toast('Закупка сохранена','ok');render()}})}
function edit(id){pform(P(id))}
function pform(p,cb){T={photo:p.photo||null,cb};const e=!!p.id;modal(`<h2>${e?'Товар':'Новый товар'}</h2><div class="r"><div id="pp" onclick="$('#pf').click()" style="cursor:pointer">${p.photo?`<img class="th" src="${p.photo}" alt="">`:'<div class="ph">📷<small>Фото</small></div>'}</div><input id="pf" type="file" accept="image/*" capture="environment" hidden onchange="photo(this)"><small>Нажмите, чтобы сфотографировать</small></div>
<label>Название (необязательно)<input id="fn" value="${esc(p.name||'')}"></label><label>Штрихкод (пусто — получит свой код)<input id="fb" inputmode="numeric" value="${esc(p.barcode||'')}" ${e?'readonly':''}></label><label>Цена продажи, сом<input id="fp" inputmode="decimal" value="${p.price??''}"></label>${e?`<label class="ck"><input id="fa" type="checkbox" ${p.active?'checked':''}>Активен (показывать в продаже)</label>`:''}
<div class="row"><button onclick="closeModal()">Отмена</button><button class="pb" onclick="psave('${p.id||''}')">Сохранить</button></div>`)}
function photo(inp){const f=inp.files[0];if(!f)return;if(!/^image\//.test(f.type)||f.size>20e6)return toast('Нужна картинка до 20 МБ','er');const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,260/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);T.photo=c.toDataURL('image/jpeg',.65);URL.revokeObjectURL(u);$('#pp').innerHTML=`<img class="th" src="${T.photo}" alt="">`};im.onerror=()=>toast('Не удалось прочитать фото','er');im.src=u}

// ОБНОВЛЕНО: Добавлен store_id при создании товара
function psave(id,force){const n=$('#fn').value.trim(),b=$('#fb').value.trim(),pr=$('#fp').value.trim().replace(',','.');if(pr!==''&&!(+pr>=0))return toast('Цена указана неверно','er');const cb=T.cb,ph0=T.photo;let p;
if(id){p=P(id);if(tx(()=>{p.name=n;p.photo=ph0;p.price=pr===''?null:r2(+pr);p.active=$('#fa').checked}))done()}
else{const ex=db.products.filter(x=>b&&x.barcode===b);if(ex.length&&!force){return ask('Штрихкод уже есть у «'+nm(ex[0])+'». Это другой товар с тем же штрихкодом?',()=>{pform({name:n,barcode:b,price:pr===''?null:+pr,photo:ph0},cb);T.cb=cb;psave('',true)})}
if(tx(()=>{p={id:uid(), store_id:STORE_ID, code:'P'+String(++db.seq).padStart(5,'0'),barcode:b||null,v:ex.length?Math.max(...ex.map(x=>x.v))+1:1,name:n,photo:ph0,price:pr===''?null:r2(+pr),stock:0,avg:0,last:null,low:2,active:true};db.products.push(p)}))done()}
function done(){closeModal();toast('Товар сохранён','ok');cb?cb(p):render()}}
let CB=null;
async function cam(m){if(!('BarcodeDetector'in window))return toast('Этот браузер не умеет сканировать камерой. Введите код вручную (на Android лучше Chrome).','er');if(!navigator.mediaDevices?.getUserMedia)return toast('Камера недоступна: нужна защищённая страница (https).','er');
let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return toast(e.name==='NotAllowedError'?'Доступ к камере запрещён. Разрешите камеру в настройках браузера или введите код вручную.':'Камера недоступна ('+e.name+'). Введите код вручную.','er')}
const v=$('#cv');v.srcObject=st;try{await v.play()}catch(e){}$('#cam').hidden=false;const c={s:st,on:1,last:'',lt:0};CB=c;let d;try{d=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']})}catch(e){d=new BarcodeDetector()}
const loop=async()=>{if(!c.on)return;try{const r=await d.detect(v);if(r[0]){const x=r[0].rawValue;if(x!==c.last||Date.now()-c.lt>2500){c.last=x;c.lt=Date.now();navigator.vibrate&&navigator.vibrate(50);code(m,x)}}}catch(e){}setTimeout(loop,250)};loop()}
function closeCam(){if(CB){CB.on=0;CB.s.getTracks().forEach(t=>t.stop());CB=null}$('#cam').hidden=true}
function invStart(t){tx(()=>db.inv={type:t,items:{}});render()}
function addCnt(p){const v=db.inv,x=v.items[p.id]||(v.items[p.id]={book:p.stock,cnt:0,cost:''});x.cnt++;if(tx(()=>0)){toast(nm(p)+': '+x.cnt);render()}}
function setc(id,v){const n=parseInt(v);if(!(n>=0))return toast('Введите число 0 или больше','er');db.inv.items[id].cnt=n;tx(()=>0);render()}
function delc(id){delete db.inv.items[id];tx(()=>0);render()}
function invOk(){const v=db.inv,it=Object.entries(v.items);for(const[id,x]of it){const p=P(id);if(p.stock+x.cnt-x.book<0)return toast('«'+nm(p)+'»: остаток изменился с момента подсчёта, пересчитайте','er')}
if(tx(()=>{const sid=uid(),items=[];it.forEach(([id,x])=>{const p=P(id),d=x.cnt-x.book,co=d<=0?p.avg:v.type==='initial'&&x.cost!==''?r2(+x.cost):p.avg>0?p.avg:0;items.push({pid:id,book:x.book,cnt:x.cnt,delta:d,cost:co});if(!d)return;if(d>0)p.avg=wavg(p.stock,p.avg,d,d*co);p.stock+=d;mv(p,v.type==='initial'&&d>0?'opening_balance':'adjust',d,co,sid)});db.invs.push({id:sid, store_id:STORE_ID, user_id:USER_ID, n:nx('i',db.invs), created_at:Date.now(), type:v.type, status:'ok', items});db.inv=null})){toast('Пересчёт применён','ok');render()}}

// ОБНОВЛЕНО: Чтение истории из receipt_items и stock_movements
const KIND={s:['Продажа','receipts'],p:['Закупка','purchases'],i:['Пересчёт','invs']},MT={sale:'продажа',sale_cancel:'отмена продажи',purchase:'приход',purchase_cancel:'отмена прихода',opening_balance:'начальный остаток',adjust:'корректировка',adjust_cancel:'отмена корректировки'};
const docsAll=()=>Object.keys(KIND).flatMap(k=>db[KIND[k][1]].map((d,i)=>({k,d,num:d.n||i+1})));
const allDocs=()=>docsAll().filter(x=>x.d.status!=='deleted').sort((a,b)=>b.d.created_at-a.d.created_at);
const findDoc=id=>docsAll().find(x=>x.d.id===id);

function openDoc(id){const x=findDoc(id),d=x.d,st=d.status||'ok';
let lines='';
if(x.k==='s'){
    const items=db.receipt_items.filter(i=>i.receipt_id===id);
    lines = items.map(i=>{const n=esc(nm(P(i.product_id))); return `<div class="bar"><span>${n} × ${i.quantity} по ${fmt(i.price_at_sale)}</span><b>${fmt(i.quantity*i.price_at_sale)}</b></div>`}).join('');
} else {
    lines = d.items.map(i=>{const n=esc(nm(P(i.pid)));return x.k==='i'?`<div class="bar"><span>${n}</span><b>учёт ${i.book} → факт ${i.cnt} (${i.delta>0?'+':''}${i.delta})</b></div>`:`<div class="bar"><span>${n} × ${i.q} по ${fmt(i.cost)}</span><b>${fmt(i.q*i.cost)}</b></div>`}).join('');
}
const sm=x.k==='s'?`<div class="bar"><b>Итого</b><b>${fmt(d.total_amount)}</b></div><div class="bar"><span>Себестоимость</span><span>${fmt(d.total_cogs)}</span></div><div class="bar"><span>Валовая прибыль</span><span>${fmt(d.total_amount-d.total_cogs)}</span></div>`:x.k==='p'?`<div class="bar"><b>Итого</b><b>${fmt(d.total)}</b></div>`:'';
const mvs=db.stock_movements.filter(m=>m.src===id).map(m=>`<div class="bar"><span>${esc(nm(P(m.product_id)))}</span><span>${MT[m.type]||m.type}: ${m.quantity>0?'+':''}${m.quantity} шт → остаток ${m.after}</span></div>`).join('');
modal(`<h2>${KIND[x.k][0]} № ${x.num}</h2><small>${new Date(d.created_at).toLocaleString('ru-RU')} · ${st==='ok'?'проведён':'проведение отменено'}${d.fixOf?' · исправляет № '+d.fixOf:''}</small><div class="c">${lines}${sm}</div><h2>Движения товара</h2><div class="c">${mvs||'<small>—</small>'}</div>
<div class="row"><button onclick="closeModal()">Закрыть</button>${st==='ok'&&x.k!=='i'?`<button onclick="fixDoc('${id}')">Исправить</button>`:''}</div>
${st==='ok'?`<button class="big" onclick="ask('Отменить проведение? Остатки и средняя цена вернутся.',()=>undo('${id}'))">Отменить проведение</button>`:`<button class="big" onclick="ask('Удалить документ из списка? Движения останутся в истории.',()=>delDoc('${id}'))">Удалить из списка</button>`}`)}

function undo(id){const x=findDoc(id);if(tx(()=>{x.k==='s'?revSale(x.d):x.k==='p'?revBuy(x.d):revInv(x.d)})){toast('Проведение отменено','ok');render()}}
function delDoc(id){const x=findDoc(id);if(tx(()=>x.d.status='deleted')){toast('Документ удалён из списка','ok');render()}}
function fixDoc(id){const x=findDoc(id);closeModal();
if(x.k==='s'){
    const items=db.receipt_items.filter(i=>i.receipt_id===x.d.id);
    const q={};items.forEach(i=>q[i.product_id]=(q[i.product_id]||0)+i.quantity);
    S.fix={id,n:x.num,q};
    S.cart=items.map(i=>({pid:i.product_id,q:i.quantity,price:i.price_at_sale}));
    go('sale');
} else {
    const it=x.d.items;
    S.pfix={id,n:x.num};S.pcart=it.map(i=>({pid:i.pid,q:i.q,cost:i.cost}));go('buy');
} toast('Исправьте документ и сохраните')}

function csv(k){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';let rows;
if(k==='s'){rows=[['Дата','Товар','Кол-во','Цена','Себестоимость за шт','Прибыль']];db.receipts.forEach(s=>{const d=dk(s.created_at);if(s.status==='ok'&&d>=S.from&&d<=S.to){db.receipt_items.filter(i=>i.receipt_id===s.id).forEach(i=>rows.push([d,nm(P(i.product_id)),i.quantity,i.price_at_sale,i.cost_at_sale,r2(i.quantity*(i.price_at_sale-i.cost_at_sale))]))}})}
else{rows=[['Код','Штрихкод','Товар','Остаток','Ср. себестоимость','Стоимость']];db.products.forEach(p=>rows.push([p.code,p.barcode||'',nm(p),p.stock,p.avg,r2(p.stock*p.avg)]))}
const t=rows.map(r=>r.map(q).join(';')).join('\n');modal(`<h2>CSV (открывается в Excel)</h2><textarea id="ct2" readonly>${esc(t)}</textarea><div class="row"><button onclick="closeModal()">Закрыть</button><button class="pb" onclick="cp()">Копировать</button></div>`)}
function cp(){const t=$('#ct2');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('Скопировано','ok'),()=>{try{document.execCommand('copy')?toast('Скопировано','ok'):toast('Выделите текст и скопируйте вручную')}catch(e){toast('Выделите текст и скопируйте вручную')}})}
render();
</script></body></html>
