<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
<title>Магазин</title>
<style>
/* 
=========================================================
 CSS-ПЕРЕМЕННЫЕ И БАЗОВЫЕ НАСТРОЙКИ ТЕМЫ
=========================================================
Поддержка светлой и темной темы (prefers-color-scheme).
Цвета вынесены в переменные для быстрой смены брендинга.
*/
:root{--bg:#f4f5f2;--cd:#fff;--tx:#1c2321;--mu:#68716d;--br:#dfe3de;--pr:#0f766e;--pt:#fff;--ok:#15803d;--er:#b42318;--wa:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#121615;--cd:#1c2220;--tx:#eef2ef;--mu:#9aa5a0;--br:#2c3532;--pr:#2dd4bf;--pt:#06201c;--ok:#4ade80;--er:#f87171;--wa:#fbbf24}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; touch-action: manipulation;}

/* Основной контейнер приложения с отступом под нижнюю навигацию */
#app{max-width:640px;margin:0 auto;padding:14px 14px 96px}

/* Типографика и базовые элементы */
h1{font-size:24px;margin:6px 0 12px}h2{font-size:17px;margin:20px 0 8px}
small{color:var(--mu);font-size:13px}.mu{color:var(--mu);padding:10px 0}
button,input{font:inherit;color:inherit}
button{min-height:48px;padding:0 16px;border:1px solid var(--br);background:var(--cd);border-radius:12px;cursor:pointer}
button.pb{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:600}
button.big{width:100%;min-height:56px;font-size:18px;margin-top:12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
input{width:100%;min-height:48px;padding:0 12px;border:1px solid var(--br);border-radius:12px;background:var(--cd)}
label{display:block;margin:10px 0;font-size:14px;color:var(--mu)}label input{margin-top:4px;color:var(--tx)}

/* 
=========================================================
 КАРТОЧКИ, СПИСКИ И ФОРМЫ (UI КОМПОНЕНТЫ)
=========================================================
*/
/* Карточка товара/документа (белая плашка) */
.c{background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:12px;margin:10px 0}
/* Сетка для дашборда (2 колонки) */
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g .c{margin:0}.g b{display:block;font-size:22px}.g .w{grid-column:1/3}
/* Flex-строка с отступами */
.row,.r{display:flex;gap:8px;align-items:center}.row{margin:12px 0}.row button{flex:1}.f{flex:1;min-width:0}
/* Усечение длинного текста троеточием */
.f b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Миниатюры фотографий в списках товаров */
.th, .ph { width: 44px; height: 44px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
.ph { background: var(--br); display: flex; align-items: center; justify-content: center; font-size: 22px; }

/* Панель поиска и сканирования (залипает сверху при скролле) */
.sb{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:3}.sb input{flex:1}
/* Элементы корзины (количество, цена) */
.q{min-width:32px;text-align:center;font-size:20px}.pi{width:96px;text-align:right}.lt{flex:1;text-align:right;font-weight:600}
/* Кнопка крестик/иконка */
.x{min-height:40px;width:40px;padding:0}
/* Итоговая сумма внизу */
.tot{display:flex;justify-content:space-between;font-size:22px;padding:14px 4px 0}

/* Цвета статусов */
.lo{color:var(--er)}.ok{color:var(--ok)}.wa{color:var(--wa)}

/* 
=========================================================
 НАВИГАЦИЯ, МОДАЛЬНЫЕ ОКНА И УВЕДОМЛЕНИЯ
=========================================================
*/
/* Нижнее меню (TabBar) */
nav{position:fixed;left:0;right:0;bottom:0;display:none;background:var(--cd);border-top:1px solid var(--br);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:0 2px;color:var(--mu)}
nav button span{font-size:20px}nav button.on{color:var(--pr);font-weight:700}

/* Затемнение (оверлей) и контейнер модального окна (BottomSheet) */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.ov[hidden]{display:none}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:14px 14px calc(24px + env(safe-area-inset-bottom,0px))}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--br);position:sticky;top:-14px;background:var(--bg);z-index:2;margin-top:-6px;padding-top:6px}
.sh-head h2{margin:0;font-size:18px;text-align:center;flex:1}
.sh-head .btn-cancel{background:none;border:none;color:var(--mu);font-size:15px;cursor:pointer;padding:6px 4px;font-family:inherit}
.sh-head .btn-save{background:var(--pr);color:var(--pt);border:none;border-radius:8px;font-size:15px;font-weight:600;padding:8px 16px;cursor:pointer;font-family:inherit}

/* Всплывающие уведомления (Toast) сверху */
#toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;padding:12px 14px;border-radius:12px;display:none;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}

/* Статистика и документы */
.bar{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px}
.gr{background:var(--ok);color:var(--pt);border-color:var(--ok)}.rd{background:var(--er);color:var(--pt);border-color:var(--er)}

/* 1. Контейнер камеры: на весь экран (под модальными окнами и уведомлениями) */
#cam { position: fixed; inset: 0; background: #000; z-index: 8; display: block; }
#cam[hidden] { display: none !important; }

/* 2. Видео создаётся заново при каждом открытии (иначе iOS иногда «залипает» на уменьшенном размере) */
#cvbox { position: absolute; inset: 0; z-index: 1; }
#cvbox video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* 3. Рамка прицеливания (220x120) */
.cam-frame {
  position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
  width: 220px; height: 120px; z-index: 2; pointer-events: none;
  background: 
    linear-gradient(#fbbf24, #fbbf24) top left / 20px 3px no-repeat,
    linear-gradient(#fbbf24, #fbbf24) top left / 3px 20px no-repeat,
    linear-gradient(#fbbf24, #fbbf24) top right / 20px 3px no-repeat,
    linear-gradient(#fbbf24, #fbbf24) top right / 3px 20px no-repeat,
    linear-gradient(#fbbf24, #fbbf24) bottom left / 20px 3px no-repeat,
    linear-gradient(#fbbf24, #fbbf24) bottom left / 3px 20px no-repeat,
    linear-gradient(#fbbf24, #fbbf24) bottom right / 20px 3px no-repeat,
    linear-gradient(#fbbf24, #fbbf24) bottom right / 3px 20px no-repeat;
}
.cam-laser { position: absolute; width: 100%; height: 2px; background: #fbbf24; box-shadow: 0 0 10px #fbbf24; animation: scan 2s infinite ease-in-out; }
@keyframes scan { 0%, 100% { top: 5%; } 50% { top: 95%; } }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 36px; height: 36px; border: 3px solid var(--br); border-top-color: var(--pr); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }

/* 4. Нижняя плашка */
.cam-bottom { position: absolute; bottom: 0; left: 0; right: 0; background: var(--cd); border-radius: 20px 20px 0 0; padding: 24px 16px calc(16px + env(safe-area-inset-bottom, 0px)); text-align: center; z-index: 2; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); }
.cam-bottom h3 { margin: 0 0 8px; font-size: 20px; }
.cam-bottom p { color: var(--mu); margin: 0 0 24px; font-size: 15px; line-height: 1.4; }

/* Кнопка отмены */
.cam-cancel { background: none; border: none; color: var(--mu); font-size: 15px; padding: 12px; margin-top: 12px; min-height: 40px; display: inline-block; cursor: pointer; }

/* Скрываем элементы с классом owner-only, если включен режим кассира */
.cashier-mode .owner-only { display: none !important; }

/* Окно создания документа (продажа / закупка / сверка): закрывает список и нижнее меню */
#win{position:fixed;inset:0;z-index:6;background:var(--bg);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px))}
#win[hidden]{display:none}
#win .wi{max-width:640px;margin:0 auto}
.wh{display:flex;align-items:center;gap:12px;margin-bottom:6px}.wh b{font-size:20px}
.sm{min-height:40px;font-size:14px;padding:0 10px;flex:none}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:14px;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.cc b{font-size:17px;overflow-wrap:anywhere}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.chips button{flex:none;min-height:40px;padding:0 14px}
.chips button.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.cbar{position:sticky;bottom:0;padding:10px 0 2px;background:linear-gradient(to bottom,transparent,var(--bg) 35%)}.cbar .big{margin-top:0}
.bd{background:var(--pr);color:var(--pt);border-radius:999px;min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;padding:0 8px;flex:none}
</style>
<!-- Подключение SDK Telegram Web App -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Подключение Supabase JS клиента -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<!-- Распознавание штрихкодов: ZXing-C++ (WebAssembly) с интерфейсом BarcodeDetector -->
<script defer src="https://cdn.jsdelivr.net/npm/barcode-detector@3.0.1/dist/iife/ponyfill.min.js"></script>
</head>
<body>

<!-- Главный контейнер для рендера страниц -->
<div id="app"><div style="text-align:center;padding:80px 16px"><div class="spinner"></div><h2 style="margin:0 0 8px">Подключение к серверу…</h2><p class="mu" style="margin:0">Пожалуйста, подождите…</p></div></div>

<!-- Нижнее меню навигации -->
<div id="win" hidden></div>

<nav id="nav">
  <button data-t="home" onclick="go('home')"><span>🏠</span>Главная</button>
  <button class="owner-only" data-t="buy" onclick="go('buy')"><span>📥</span>Закупка</button>

  <button data-t="prod" onclick="go('prod')"><span>📦</span>Товары</button>
  <button class="owner-only" data-t="exp" onclick="go('exp')"><span>💸</span>Расходы</button>
  <button class="owner-only" data-t="more" onclick="go('more')"><span>⋯</span>Ещё</button>
</nav>

<!-- Окно камеры сканера штрихкодов -->
<div id="cam" hidden>
  <!-- Сюда при каждом открытии добавляется новый <video>. Тап по видео тоже закрывает сканер -->
  <div id="cvbox" onclick="closeCam()"></div>

  <div class="cam-frame">
    <div class="cam-laser"></div>
  </div>

  <div class="cam-bottom">
    <h3>Отсканируйте код</h3>
    <p>Наведите рамку на штрихкод<br><span style="font-size:13px; opacity:0.8;">Отдалите телефон на 15–20 см для фокуса</span></p>

    <svg width="120" height="60" viewBox="0 0 120 60" fill="currentColor" style="color: var(--tx); margin: 0 auto; display: block; overflow: visible;">
      <rect x="0" y="0" width="6" height="60" />
      <rect x="10" y="0" width="4" height="60" />
      <rect x="20" y="0" width="10" height="60" />
      <rect x="34" y="0" width="4" height="60" />
      <rect x="42" y="0" width="14" height="60" />
      <rect x="60" y="0" width="6" height="60" />
      <rect x="70" y="0" width="8" height="60" />
      <rect x="84" y="0" width="4" height="60" />
      <rect x="94" y="0" width="8" height="60" />
      <rect x="108" y="0" width="4" height="60" />
      <rect x="116" y="0" width="4" height="60" />
      <path d="M -5 10 L -5 -5 L 10 -5" fill="none" stroke="#fbbf24" stroke-width="3" />
      <path d="M 125 10 L 125 -5 L 110 -5" fill="none" stroke="#fbbf24" stroke-width="3" />
      <path d="M -5 50 L -5 65 L 10 65" fill="none" stroke="#fbbf24" stroke-width="3" />
      <path d="M 125 50 L 125 65 L 110 65" fill="none" stroke="#fbbf24" stroke-width="3" />
    </svg>

    <button class="cam-cancel" onclick="closeCam()">Отмена</button>
  </div>
</div>

<!-- Контейнер для всплывающих окон (BottomSheet) -->
<div class="ov" id="md" hidden><div class="sh" id="mb"></div></div>

<!-- Контейнер для системных уведомлений -->
<div id="toast" role="status"></div>

<script>
/* 
=========================================================
 1. ИНИЦИАЛИЗАЦИЯ И ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
=========================================================
*/
// Глобальный перехват ошибок с самого начала, чтобы ни один сбой не приводил к вечной загрузке
window.addEventListener('error', function(e) {
  console.error('Global error:', e.error || e.message);
  var app = document.getElementById('app');
  if (app && (!app.innerHTML || app.innerHTML.indexOf('spinner') !== -1)) {
    app.innerHTML = '<div style="padding:40px 16px;text-align:center"><h2>Ошибка запуска</h2><p class="mu" style="margin:12px 0">' + (e.message || 'Ошибка выполнения скрипта') + '</p><button class="pb big" onclick="location.reload()">Повторить</button></div>';
  }
});
window.addEventListener('unhandledrejection', function(e) {
  console.error('Unhandled rejection:', e.reason);
  var msg = (e && e.reason && (e.reason.message || String(e.reason))) || 'Ошибка запроса';
  var app = document.getElementById('app');
  if (app && (!app.innerHTML || app.innerHTML.indexOf('spinner') !== -1)) {
    app.innerHTML = '<div style="padding:40px 16px;text-align:center"><h2>Ошибка подключения</h2><p class="mu" style="margin:12px 0">' + msg + '</p><button class="pb big" onclick="location.reload()">Повторить</button></div>';
  }
});

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

if (typeof supabase === 'undefined') {
  var app = document.getElementById('app');
  if (app) {
    app.innerHTML = '<div style="padding:40px 16px;text-align:center"><h2>Ошибка сети</h2><p class="mu" style="margin:12px 0">Не удалось загрузить библиотеку Supabase. Проверьте интернет-соединение.</p><button class="pb big" onclick="location.reload()">Повторить</button></div>';
  }
  throw new Error('Supabase client library not loaded');
}

const SUPABASE_URL = 'https://zejpqdzashqaudcxdpoh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5FcwXPo1yU6BzYhmmfVQcA_DNv9U7ku';
let sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const sb0 = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); // клиент без токена — только для входа (auth-store)

// Глобальное состояние приложения
let BRANCH = null, BRANCHES = [], IS_ADMIN = false,   // текущий филиал, доступные филиалы, администратор платформы
    STORE = null,       // ID магазина
    USER = null,        // ID пользователя (Telegram)
    ROLE = null,        // Роль (owner/cashier)
    STORE_NAME = 'Сегодня',
    P = [],             // Локальный кэш каталога товаров (P - Products)
    busy = false,       // Блокировка интерфейса во время сетевых запросов
    ASK = null,         // Callback для модального окна подтверждения
    T = null,           // Временные данные для модальных окон
    tmr;                // Таймер скрытия toast-уведомлений
const LOW = 2;          // Порог предупреждения о низком остатке товара
const APP_VERSION = '1.11.3'; // Меняйте при каждой загрузке файла: видно внизу главной, помогает понять, не показывается ли старая версия из кэша

/* 
=========================================================
 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ (Утилиты)
=========================================================
Функции объявлены через function (а не const), чтобы они были доступны
в любом месте файла, в том числе при создании состояния ниже.
*/
function $(s) { return document.querySelector(s); }
function r2(n) { return Math.round(n * 100) / 100; } // Округление до 2 знаков
function fmt(n) { return r2(+n || 0).toLocaleString('ru-RU') + ' сом'; } // Формат валюты
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); } // Экранирование XSS
function dk(t) { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); } // Формат даты YYYY-MM-DD
function today() { return dk(Date.now()); }
function G(id) { return P.find(p => p.id === id); } // Получить товар из кэша по ID
function nm(p) { return p ? (p.name || p.barcode || 'Без названия') : '(удалён)'; } // Имя товара с fallback
function num(v) { v = String(v ?? '').trim().replace(',', '.'); if (v === '') return 0; return +v >= 0 ? r2(+v) : false; } // Парсинг чисел из инпутов

// Состояние текущей сессии (переключение вкладок, корзины)
const S = { 
  docs: {},             // Кэш загруженных документов (чеки, закупки)
  tab: 'home',          // Текущая активная вкладка
  cart: [],             // Корзина продажи (sale)
  pcart: [],            // Корзина закупки (buy)
  inv: {},              // Список товаров в сверке (inv)
  rb: null,             // Филиал в отчётах: id или 'all'
  cartView: false,      // В окне продажи: показан чек (true) или каталог (false)
  sq: '', cat: null, sub: null, lim: 30,   // Поиск, выбранная категория/подкатегория, сколько товаров показано
  bsq: '', blim: 30,                       // Поиск в окне закупки (живой поиск как в продаже)
  hp: 'day',            // Главная: период показателей ('day' | 'month')
  ef: monthStart(), et: today(), ecat: '', elim: 50,   // Расходы: период, категория, сколько записей показано
  from: today(),        // Начальная дата для отчетов
  to: today()           // Конечная дата для отчетов 
};

/* Вывод уведомлений на экран */
function toast(m, k) {
  const t = $('#toast'); t.textContent = m; t.style.display = 'block';
  t.style.background = k === 'er' ? 'var(--er)' : k === 'ok' ? 'var(--ok)' : 'var(--tx)';
  t.style.color = k ? 'var(--pt)' : 'var(--bg)';
  clearTimeout(tmr); tmr = setTimeout(() => t.style.display = 'none', k === 'er' ? 3500 : 1500);
}

/* Обертка для асинхронных вызовов к БД (блокирует повторные клики) */
async function run(fn) {
  if (busy) return; busy = true;
  try { await fn(); }
  catch (e) {
    if (/jwt|token|expired/i.test(e.message || '')) { try { await relogin(); toast('Сессия обновлена — повторите действие'); } catch (e2) { toast('Сессия истекла — откройте приложение заново', 'er'); } }
    else toast(e.message || String(e), 'er');
  } 
  finally { busy = false; render(); }
}

/* Управление модальными окнами */
function modal(h) {
  const mb = $('#mb'), md = $('#md');
  mb.className = 'sh';
  mb.innerHTML = h;
  md.hidden = false;
}
function closeModal() {
  const mb = $('#mb'), md = $('#md');
  md.hidden = true;
  mb.className = 'sh';
  mb.innerHTML = '';
}
function ask(t, y) { ASK = y; modal(`<h2>${esc(t)}</h2><div class="row"><button onclick="closeModal()">Нет</button><button class="pb" onclick="closeModal();ASK()">Да</button></div>`); }

/* 
=========================================================
 3. РАБОТА С БАЗОЙ ДАННЫХ (Supabase)
=========================================================
*/

/* Загрузка полного каталога товаров магазина в локальный кэш (пагинация по 1000) */
async function load() {
  const pProducts = (async () => {
    let all = [], f = 0;
    for (;;) {
      const { data, error } = await sb.from('products').select('*').eq('store_id', STORE).order('name').range(f, f + 999);
      if (error) throw error;
      if (!data || !data.length) break;
      all = all.concat(data);
      if (data.length < 1000) break;
      f += 1000;
    }
    return all;
  })();

  const pStock = (async () => {
    const bs = {}; let f = 0;
    for (;;) {
      const { data, error } = await sb.from('branch_stock').select('product_id,stock_quantity,cost_price').eq('branch_id', BRANCH).range(f, f + 999);
      if (error) throw error;
      if (!data || !data.length) break;
      data.forEach(r => bs[r.product_id] = r);
      if (data.length < 1000) break;
      f += 1000;
    }
    return bs;
  })();

  const pCats = (async () => {
    try {
      const cr = await sb.from('categories').select('*').eq('store_id', STORE).order('sort_order').order('created_at');
      if (cr.error) { console.warn('categories error:', cr.error); return []; }
      return cr.data || [];
    } catch (e) {
      console.warn('categories exception:', e);
      return [];
    }
  })();

  const [all, bs, cats] = await Promise.all([pProducts, pStock, pCats]);
  CATS = cats || [];
  await loadECats();
  P = (all || []).map(p => ({ ...p, stock_quantity: bs[p.id] ? bs[p.id].stock_quantity : 0, cost_price: bs[p.id] ? +bs[p.id].cost_price : 0 }));
}

/* Выгрузка статистики за период */
async function stats(f, t, ids) {
  ids = ids || [BRANCH];
  const a = new Date(f + 'T00:00:00').toISOString(), b = new Date(t + 'T23:59:59.999').toISOString();
  const { data, error } = await sb.from('receipts')
    .select('id,total_amount,total_cogs,created_at,receipt_items(product_id,quantity,price_at_sale)')
    .eq('store_id', STORE).in('branch_id', ids).eq('deleted', false).gte('created_at', a).lte('created_at', b).order('created_at', { ascending: false }).limit(1000);
  if (error) throw error;
  
  const list = data || [];
  const o = { n: list.length, rev: 0, cost: 0, u: 0, by: {}, list };
  list.forEach(s => {
    o.rev += +s.total_amount || 0; o.cost += +s.total_cogs || 0;
    (s.receipt_items || []).forEach(i => {
      o.u += i.quantity || 0;
      const x = o.by[i.product_id] || (o.by[i.product_id] = { u: 0, rev: 0 });
      x.u += i.quantity || 0; x.rev += (i.quantity || 0) * (i.price_at_sale || 0);
    });
  });
  o.rev = r2(o.rev); o.cost = r2(o.cost); o.gp = r2(o.rev - o.cost);
  return o;
}

    }
    const by = {}; let sum = 0;
    all.forEach(e => { if (e && e.amount) { sum += +e.amount; by[e.category_id] = (by[e.category_id] || 0) + +e.amount; } });
    return { list: all, sum: r2(sum), by };
  } catch (e) {
    console.warn('expList error:', e);
    return noExp;
  }
}
const noExp = { list: [], sum: 0, by: {} };
// Выручка − себестоимость продаж = валовая прибыль; валовая прибыль − операционные расходы = прибыль после расходов.
// Закупки товара в расходы НЕ входят: себестоимость уже учтена при продаже.

const periodBar = (fk, tk) => {

};
function setPeriod(fk, tk, f) { S[fk] = f; S[tk] = today(); S.elim = 50; render(); }

/* Главная функция обновления DOM */
async function render() {
  $('#nav').style.display = 'flex';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === (NAVT[S.tab] || S.tab)));
  const t = S.tab, h = (BACK[t] ? '<button class="sm" style="margin-bottom:8px" onclick="go(\'more\')">← Ещё</button>' : '') + await V[t]();
  if (t !== S.tab) return;
  $('#app').innerHTML = h;
  const w = $('#win');
  if (S.win && V[S.win + 'Form']) {
    w.innerHTML = `<div class="wi"><div class="wh"><button onclick="closeWin()">← Назад</button><b>${WN[S.win][2]}</b></div>` + V[S.win + 'Form']() + '</div>';
    w.hidden = false;
  } else { w.hidden = true; w.innerHTML = ''; }
  try { if (tg && tg.BackButton) S.win ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
  if (t === 'prod') plist();
}

/* Смена вкладки */
function go(t) { 
  S.win = null; S.tab = t; 
  render().catch(e => toast(e.message, 'er')); 
  // Если для вкладки есть документы (чеки), загружаем их
  if (TK[t]) loadDocs(TK[t]).then(render).catch(e => toast(e.message, 'er')); 
  scrollTo(0, 0); 
}

/* Загрузка ленты документов для текущей вкладки */
async function loadDocs(k) {
  let q = sb.from(DK[k][0]).select('*,' + DK[k][1]).eq('store_id', STORE).eq('branch_id', BRANCH).order('created_at', { ascending: false }).limit(S.jall ? 300 : 100);

  const { data, error } = await q; if (error) throw error;
  S.docs[k] = data;

// Локальный поиск по массиву кэша товаров (P)
function find(q) {
  q = q.trim(); if (!q) return [];
  const l = q.toLowerCase();
  const a = P.filter(p => p.barcode === q); if (a.length) return a;
  return P.filter(p => (p.name || '').toLowerCase().includes(l));
}

// Обработка ручного поиска (когда нажали кнопку "Найти")
function look(m) {
  const e = $('#sq'), v = e.value;
  if (m === 'sale' || m === 'buy') {
    const l = find(v);
    if (l.length > 1 && !l.every(p => p.barcode === v.trim())) return;
    if (m === 'sale') S.sq = '';
    if (m === 'buy') S.bsq = '';
  }
  e.value = ''; code(m, v);
}

// Обработка штрихкода (введенного вручную или со сканера)
function code(m, v) {
  v = v.trim(); if (!v) return;
  const l = find(v);
  
  // Если товар не найден - предлагаем создать новый (заполняя штрихкод)
  if (!l.length) { closeCam(); return pform(/^\d{6,}$/.test(v) ? { barcode: v } : { name: v }, m === 'prod' ? null : p => hit(m, p)); }
  // Если найден ровно один товар - сразу добавляем в корзину
  if (l.length === 1) { return hit(m, l[0]); }
  // Если найдено несколько (по совпадению имени) - показываем модальное окно выбора
  closeCam(); T = { l, cb: p => hit(m, p) };
  modal('<h2>Выберите товар</h2>' + l.map((p, i) => `<div class="c r" onclick="closeModal();T.cb(T.l[${i}])" style="cursor:pointer"><div class="f"><b>${esc(nm(p))}</b><small>${esc(p.barcode || '')}</small></div><b>${p.stock_quantity} шт</b></div>`).join(''));
}

// Добавление товара в нужную корзину (Продажа, Закупка, Сверка)
function hit(m, p) {
  if (m === 'prod') { closeCam(); return pform(p); } // на вкладке «Товары» сканирование открывает карточку
  if (m === 'sale') { const l = S.cart.find(x => x.id === p.id); if (l) l.q++; else S.cart.push({ id: p.id, q: 1, price: p.retail_price || '' }); }
  else if (m === 'buy') { const l = S.pcart.find(x => x.id === p.id); if (l) l.q = (+l.q || 0) + 1; else S.pcart.push({ id: p.id, q: 1, cost: p.cost_price || '' }); }
  else { const x = S.inv[p.id] || (S.inv[p.id] = { cnt: 0, cost: '' }); x.cnt++; }
  toast('+ ' + nm(p)); render();
}

/* 
=========================================================
 СКАНЕР ШТРИХКОДОВ (камера + barcode-detector)
=========================================================
iOS спрашивает доступ к камере при каждом getUserMedia, поэтому поток камеры держим открытым
между сканированиями (запрос появляется один раз) и отпускаем после CAM_IDLE_MS простоя.
*/
let CAMSTREAM = null, camIdle = null, CB = null;
const CAM_IDLE_MS = 3 * 60 * 1000;  // через сколько после закрытия сканера отпускать камеру
const BARCODE_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'qr_code']; // меньше форматов — быстрее

function releaseCam() { clearTimeout(camIdle); if (CAMSTREAM) { CAMSTREAM.getTracks().forEach(t => t.stop()); CAMSTREAM = null; } }

// Прогрев: заранее загружает модуль распознавания, чтобы первое сканирование не тормозило
function warmScanner() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 8;
    new BarcodeDetectionAPI.BarcodeDetector({ formats: ['ean_13'] }).detect(c).catch(() => {});
  } catch (e) {}
}

async function scanBarcode(m) {
  if (!navigator.mediaDevices?.getUserMedia) return toast('Камера недоступна', 'er');
  if (!window.BarcodeDetectionAPI) return toast('Модуль сканера не загружен — проверьте интернет', 'er');
  clearTimeout(camIdle);
  try {
    if (!CAMSTREAM || !CAMSTREAM.getVideoTracks().some(t => t.readyState === 'live'))
      CAMSTREAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } });
    $('#cam').hidden = false; // окно показываем только после получения доступа
    const box = $('#cvbox'); box.innerHTML = '';
    const v = document.createElement('video'); // новый <video> при каждом открытии
    v.setAttribute('playsinline', ''); v.muted = true;
    box.appendChild(v); v.srcObject = CAMSTREAM; await v.play();
    const det = new BarcodeDetectionAPI.BarcodeDetector({ formats: BARCODE_FORMATS });
    const c = { on: 1, last: '', lt: 0 }; CB = c;
    const loop = async () => {
      if (!c.on) return;
      try {
        if (v.readyState >= 2) {
          const r = await det.detect(v);
          if (c.on && r[0]) {
            const x = r[0].rawValue;
            // защита от повторного срабатывания на тот же штрихкод (2,5 сек)
            if (x !== c.last || Date.now() - c.lt > 2500) {
              c.last = x; c.lt = Date.now();
              if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); else if (navigator.vibrate) navigator.vibrate(50);
              closeCam();   // сразу скрываем камеру
              code(m, x);   // добавляем товар (или открываем форму нового)
              return;       // останавливаем цикл
            }
          }
        }
      } catch (e) {}
      if (c.on) setTimeout(loop, 100);
    };
    loop();
  } catch (e) {
    closeCam(); releaseCam();
    toast('Камера недоступна или доступ запрещён', 'er');
  }
}

function closeCam() {
  if (CB) { CB.on = 0; CB = null; clearTimeout(camIdle); camIdle = setTimeout(releaseCam, CAM_IDLE_MS); }
  const v = $('#cvbox video'); if (v) { v.pause(); v.srcObject = null; v.remove(); } // дорожки камеры не останавливаем — иначе iOS снова спросит доступ
  $('#cam').hidden = true;
}

// Генератор UUID для надежного создания ID товара на клиенте
function genUUID() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
    var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

// Конвертер Data URL в Blob для отправки в Supabase Storage
async function dataUrlToBlob(dataUrl) {
  try {
    return await (await fetch(dataUrl)).blob();
  } catch (e) {
    var parts = dataUrl.split(',');
    var mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
    var bin = atob(parts[1]);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
}

// Изменение размера и компрессия фотографии перед отправкой (600px для четкости на экранах телефонов)
function photo(inp) {
  const f = inp.files[0]; if (!f) return;
  if (!/^image\//.test(f.type) || f.size > 20e6) return toast('Нужна картинка до 20 МБ', 'er');
  const im = new Image(), u = URL.createObjectURL(f);
  im.onload = () => {
    const maxSide = 600;
    const k = Math.min(1, maxSide / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u);
    const dataUrl = c.toDataURL('image/jpeg', 0.8);
    T.photoDataUrl = dataUrl;
    T.photo = dataUrl;
    T.photoDeleted = false;
    $('#pp').innerHTML = `<img src="${dataUrl}" style="width:100%;max-height:140px;object-fit:contain;display:block;margin:0 auto" alt="">`;
    const pd = $('#pdel'); if (pd) pd.innerHTML = '<button type="button" class="sm" style="color:var(--er);background:transparent;border:none;cursor:pointer" onclick="delPhoto(event)">Удалить фото</button>';
    if (c.toBlob) {
      c.toBlob(b => { T.photoBlob = b; }, 'image/jpeg', 0.8);
    } else {
      dataUrlToBlob(dataUrl).then(b => { T.photoBlob = b; });
    }
  };
  im.onerror = () => toast('Не удалось прочитать фото', 'er'); im.src = u;
}

// Сохранение карточки товара в БД + выгрузка фото в Supabase Storage
function psave(id) {
  run(async () => {
    const n = $('#fn').value.trim(), b = $('#fb').value.trim(), r = num($('#fp').value);
    if (!n && !b) throw new Error('Укажите название или штрихкод');
    if (r === false) throw new Error('Цена указана неверно');
    if (b && P.some(x => x.barcode === b && x.id !== id)) throw new Error('Такой штрихкод уже есть');
    // категория необязательна: подкатегория → иначе категория → иначе без категории; владелец может создать новую прямо здесь
    let catId = null; const fc = $('#fc').value, fs = $('#fs') ? $('#fs').value : '';
    if (fc === '__new') { const nn = $('#fcn').value.trim(); if (!nn) throw new Error('Введите название категории'); catId = await createCat(nn, null); }
    else if (fc) { catId = fc; if (fs === '__new') { const nn = $('#fsn').value.trim(); if (!nn) throw new Error('Введите название подкатегории'); catId = await createCat(nn, fc); } else if (fs) catId = fs; }

    const prodId = id || genUUID();
    let photoUrl = T.photo || null;

    if (T.photoDeleted) {
      photoUrl = null;
    } else if (T.photoBlob) {
      const filePath = `${STORE}/${prodId}.jpg`;
      try {
        const { error: upErr } = await sb.storage.from('product-photos').upload(filePath, T.photoBlob, {
          contentType: 'image/jpeg',
          upsert: true
        });
        if (upErr) throw upErr;
        const { data: pubData } = sb.storage.from('product-photos').getPublicUrl(filePath);
        photoUrl = pubData.publicUrl + '?t=' + Date.now();
      } catch (stErr) {
        console.warn('Storage upload error, using fallback:', stErr);
        photoUrl = T.photoDataUrl || T.photo || null;
      }
    }

    const row_data = { name: n || null, barcode: b || null, retail_price: r, photo: photoUrl, category_id: catId };
    const cb = T && T.cb; let p = null;
    if (id) {
      const { error } = await sb.from('products').update(row_data).eq('id', id).eq('store_id', STORE);
      if (error) throw error;
    } else {
      const { data, error } = await sb.from('products').insert({ id: prodId, ...row_data, store_id: STORE }).select().single();
      if (error) throw error;
      p = data;
    }
    closeModal();
    await load();
    toast('Товар сохранён', 'ok');
    if (cb && p) cb(G(p.id));
  });
}

/* Вход в функцию auth-store. Админ платформы без store_id получает список магазинов, с store_id — токен на выбранный магазин */
async function authCall(storeId) {
  const timeoutPromise = new Promise((_, reject) => 
    setTimeout(() => reject(new Error('Превышено время ожидания ответа сервера (15 сек). Пожалуйста, повторите попытку.')), 15000)
  );
  const invokePromise = sb0.functions.invoke('auth-store', { body: { initData: (tg && tg.initData) || '', store_id: storeId || undefined } });
  const { data, error } = await Promise.race([invokePromise, timeoutPromise]);
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch (e) {} throw new Error(m); }
  if (!data) throw new Error('Пустой ответ сервера');
  if (data.error) throw new Error(data.error);
  return data;
}
function applyAuth(d) {
  if (!d.token) throw new Error('Сервер не выдал токен — обновите функцию auth-store');
  STORE = d.store_id; USER = d.telegram_id; ROLE = d.role; IS_ADMIN = !!d.is_admin; STORE_NAME = d.store_name || STORE_NAME; BRANCHES = d.branches || [];
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { global: { headers: { Authorization: 'Bearer ' + d.token } } });
  document.body.classList.toggle('cashier-mode', ROLE === 'cashier');
}
async function relogin() { applyAuth(await authCall(IS_ADMIN ? STORE : null)); }

function showLoading(t = 'Подгружаем товары…', s = 'Пожалуйста, подождите…') {
  $('#nav').style.display = 'none'; $('#win').hidden = true;
  $('#app').innerHTML = `<div style="text-align:center;padding:80px 16px"><div class="spinner"></div><h2 style="margin:0 0 8px">${esc(t)}</h2><p class="mu" style="margin:0">${esc(s)}</p></div>`;
}

function showPicker(title, items, onPick, extra) {
  $('#nav').style.display = 'none'; $('#win').hidden = true;
  $('#app').innerHTML = `<h1>${esc(title)}</h1>` + items.map((x, i) => `<button class="big" style="margin:6px 0" onclick="PICK(${i})">${esc(x.name)}${x.sub ? ' <small>' + esc(x.sub) + '</small>' : ''}</button>`).join('') + (extra || '');
  window.PICK = i => onPick(items[i]);
}
async function enterStore(d) {
  applyAuth(d);
  let saved = null; try { saved = localStorage.getItem('branch_' + STORE); } catch (e) {}
  const b = BRANCHES.find(x => x.id === saved) || (BRANCHES.length === 1 ? BRANCHES[0] : null);
  if (b) return enterBranch(b);
  showPicker('Выберите филиал', BRANCHES, enterBranch, IS_ADMIN ? '<button class="big" onclick="chooseStore()">← Другой магазин</button>' : '');
}
async function enterBranch(b) {
  BRANCH = b.id; try { localStorage.setItem('branch_' + STORE, b.id); } catch (e) {}
  S.rb = null; S.docs = {}; S.cart = []; S.pcart = []; S.inv = {}; S.win = null; S.tab = 'home'; S.bsq = '';
  showLoading('Подгружаем товары…', b.name || '');
  try {
    await load();
    await render();
  } catch (e) {
    console.error('Ошибка входа в филиал:', e);
    $('#nav').style.display = 'none';
    $('#app').innerHTML = `<h1>Ошибка загрузки</h1>
      <p class="mu">${esc(e.message || String(e))}</p>
      <button class="pb big" onclick="enterBranch(BRANCHES.find(x => x.id === '${b.id}') || BRANCHES[0])">Повторить</button>
      ${IS_ADMIN ? '<button class="big" style="margin-top:8px" onclick="chooseStore()">Сменить магазин</button>' : ''}`;
    toast(e.message || String(e), 'er');
  }
}
async function chooseStore() {
  showLoading('Загружаем список магазинов…');
  try {
    const d = await authCall(null);
    showPicker('Выберите магазин', d.stores.map(s => ({ id: s.id, name: s.name, sub: s.sub_status === 'inactive' ? 'подписка неактивна' : '' })),
      async s => {
        showLoading('Подгружаем товары…', s.name);
        try {
          await enterStore(await authCall(s.id));
        } catch (e) {
          console.error('Ошибка выбора магазина:', e);
          $('#nav').style.display = 'none';
          $('#app').innerHTML = `<h1>Ошибка входа</h1>
            <p class="mu">${esc(e.message || String(e))}</p>
            <button class="pb big" onclick="chooseStore()">Выбрать другой магазин</button>`;
          toast(e.message || String(e), 'er');
        }
      });
  } catch (e) {
    $('#nav').style.display = 'none';
    $('#app').innerHTML = `<h1>Ошибка</h1><p class="mu">${esc(e.message || String(e))}</p><button class="pb big" onclick="location.reload()">Повторить</button>`;
    toast(e.message, 'er');
  }
}
function chooseBranch() { showPicker('Выберите филиал', BRANCHES, enterBranch, '<button class="big" onclick="render()">Отмена</button>'); }

/* Старт приложения */
async function startApp() {
  try {
    // Очистка возможных устаревших ключей кэша сессии
    try {
      for (var k in localStorage) {
        if (k && (k.indexOf('qr_auth_') === 0 || k.indexOf('qr_cat_') === 0)) {
          localStorage.removeItem(k);
        }
      }
    } catch (_) {}

    if (!tg || !tg.initData) {
      $('#app').innerHTML = '<h1>Откройте в Telegram</h1><p class="mu">Приложение работает только внутри Telegram.</p>';
      return;
    }

    showLoading('Подключение к серверу…', 'Авторизация в магазине…');
    const d = await authCall(null);
    if (d.pick_store) { IS_ADMIN = true; await chooseStoreFrom(d); return; }
    await enterStore(d);
    toast('Вход выполнен', 'ok');
    warmScanner();
  } catch (e) {
    $('#app').innerHTML = `<h1>Ошибка входа</h1><p class="mu">${esc(e.message || String(e))}</p><button class="pb big" onclick="location.reload()">Повторить</button>`;
  }
}
async function chooseStoreFrom(d) {
  showPicker('Выберите магазин', d.stores.map(s => ({ id: s.id, name: s.name, sub: s.sub_status === 'inactive' ? 'подписка неактивна' : '' })),
    async s => {
      showLoading('Подгружаем товары…', s.name);
      try {
        await enterStore(await authCall(s.id));
        warmScanner();
      } catch (e) {
        console.error('Ошибка входа в магазин:', e);
        $('#nav').style.display = 'none';
        $('#app').innerHTML = `<h1>Ошибка входа</h1>
          <p class="mu">${esc(e.message || String(e))}</p>
          <button class="pb big" onclick="chooseStore()">Выбрать другой магазин</button>`;
        toast(e.message || String(e), 'er');
      }
    });
}

// Запуск
startApp();
</script>
</body>
</html>
